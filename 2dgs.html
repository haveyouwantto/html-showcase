<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D Gaussian Splat 启发式分解 · 512×512 · 紧凑量化</title>
  <style>
    :root {
      --bg: #0c0e12;
      --card: #161a22;
      --border: #2a3140;
      --accent: #5b8def;
      --accent2: #3dd68c;
      --text: #eef0f4;
      --muted: #8b93a7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px 24px 40px;
      line-height: 1.5;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.88rem;
      margin-bottom: 18px;
      max-width: 920px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 16px;
      padding: 14px 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    button,
    label.btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 500;
      transition: filter 0.15s;
    }

    button:hover,
    label.btn:hover {
      filter: brightness(1.08);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      filter: none;
    }

    button.secondary {
      background: #2a3140;
    }

    button.good {
      background: var(--accent2);
      color: #0c0e12;
    }

    label.btn {
      display: inline-flex;
      align-items: center;
    }

    input[type="file"] {
      display: none;
    }

    .param {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .param input[type="number"] {
      width: 64px;
      padding: 5px 7px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #0f1218;
      color: var(--text);
    }

    .progress-wrap {
      flex: 1;
      min-width: 160px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .progress-label {
      font-size: 0.78rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }

    progress {
      width: 100%;
      height: 9px;
      border-radius: 5px;
      overflow: hidden;
      border: none;
    }

    progress::-webkit-progress-bar {
      background: #2a3140;
      border-radius: 5px;
    }

    progress::-webkit-progress-value {
      background: var(--accent);
      border-radius: 5px;
    }

    progress::-moz-progress-bar {
      background: var(--accent);
    }

    .canvases {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 14px;
      margin-bottom: 14px;
    }

    .canvas-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
    }

    .canvas-card h3 {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 6px;
    }

    canvas {
      display: block;
      margin: 0 auto;
      border-radius: 4px;
      background: #000;
      max-width: 100%;
      height: auto;
    }

    .info {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 6px;
    }

    .log {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      font-family: ui-monospace, "Cascadia Code", monospace;
      font-size: 0.75rem;
      color: var(--muted);
      max-height: 130px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    .hint {
      margin-top: 10px;
      font-size: 0.8rem;
      color: var(--muted);
      max-width: 920px;
    }
  </style>
</head>

<body>
  <h1>2D Gaussian Splat</h1>
  <p class="subtitle">
    使用高斯椭圆逐步逼近图像。上传图片或生成示例后，可以观察重建过程、残差变化以及不同数量的椭圆对画面的影响。
  </p>
  <div class="controls">
    <label class="btn">上传图片<input type="file" id="fileInput" accept="image/*"></label>
    <button id="btnSample" class="secondary">生成示例</button>
    <button id="btnStart" disabled>开始分解</button>
    <button id="btnAnimate" class="good" disabled>播放叠加动画</button>
    <button id="btnSave" class="secondary" disabled>保存 .gs2d</button>
    <label class="btn secondary">加载 .gs2d<input type="file" id="binInput"
        accept=".gs2d,application/octet-stream"></label>
    <div class="param">椭圆数 <input type="number" id="numEllipses" value="256" min="5" max="65536" step="10"></div>
    <div class="param">候选/步 <input type="number" id="numCandidates" value="70" min="10" max="300" step="10"></div>
    <div class="param">爬山次数 <input type="number" id="numRefine" value="15" min="0" max="40" step="2"></div>
    <div class="progress-wrap">
      <div class="progress-label">
        <span id="progressText">就绪</span>
        <span id="progressPct">0%</span>
      </div>
      <progress id="progressBar" value="0" max="100"></progress>
    </div>
  </div>

  <div class="canvases">
    <div class="canvas-card">
      <h3>目标图</h3>
      <canvas id="srcCanvas" width="512" height="512"></canvas>
      <div class="info" id="srcInfo">请上传或生成示例</div>
    </div>
    <div class="canvas-card">
      <h3>当前重建</h3>
      <canvas id="reconCanvas" width="512" height="512"></canvas>
      <div class="info" id="reconInfo">—</div>
    </div>
    <div class="canvas-card">
      <h3>残差</h3>
      <canvas id="resCanvas" width="512" height="512"></canvas>
      <div class="info" id="resInfo">—</div>
    </div>
  </div>

  <div class="log" id="log">等待操作…</div>
  <p class="hint">
    可以尝试调整椭圆数量、候选数量和搜索次数，比较速度、细节和重建效果之间的差异。
  </p>

  <script>
    (() => {
      const W = 512, H = 512, NPIX = W * H;
      const srcCanvas = document.getElementById('srcCanvas');
      const reconCanvas = document.getElementById('reconCanvas');
      const resCanvas = document.getElementById('resCanvas');
      const srcCtx = srcCanvas.getContext('2d', { willReadFrequently: true });
      const reconCtx = reconCanvas.getContext('2d');
      const resCtx = resCanvas.getContext('2d');

      const progressBar = document.getElementById('progressBar');
      const progressText = document.getElementById('progressText');
      const progressPct = document.getElementById('progressPct');
      const logEl = document.getElementById('log');
      const btnStart = document.getElementById('btnStart');
      const btnAnimate = document.getElementById('btnAnimate');
      const btnSave = document.getElementById('btnSave');

      let target = null;
      let recon = null;
      let residual = null;
      let ellipses = [];
      let animating = false;
      let running = false;

      function log(msg) {
        const t = new Date().toLocaleTimeString();
        logEl.textContent = `[${t}] ${msg}\n` + logEl.textContent.slice(0, 2000);
      }

      function setProgress(p, text) {
        const v = Math.max(0, Math.min(100, p));
        progressBar.value = v;
        progressPct.textContent = Math.round(v) + '%';
        if (text) progressText.textContent = text;
      }

      // ---------- 图像工具 ----------
      function imageDataToFloatRGB(imgData) {
        const d = imgData.data;
        const out = new Float32Array(NPIX * 3);
        for (let i = 0, j = 0; i < d.length; i += 4, j += 3) {
          out[j] = d[i]; out[j + 1] = d[i + 1]; out[j + 2] = d[i + 2];
        }
        return out;
      }

      function floatRGBToImageData(rgb, imgData) {
        const d = imgData.data;
        for (let i = 0, j = 0; j < rgb.length; i += 4, j += 3) {
          d[i] = Math.max(0, Math.min(255, Math.round(rgb[j])));
          d[i + 1] = Math.max(0, Math.min(255, Math.round(rgb[j + 1])));
          d[i + 2] = Math.max(0, Math.min(255, Math.round(rgb[j + 2])));
          d[i + 3] = 255;
        }
      }

      function computeResidual() {
        for (let i = 0; i < residual.length; i++) residual[i] = target[i] - recon[i];
      }

      function mse() {
        let s = 0;
        for (let i = 0; i < residual.length; i++) s += residual[i] * residual[i];
        return s / residual.length;
      }

      function drawResidual() {
        const img = resCtx.createImageData(W, H);
        const d = img.data;
        let maxA = 1e-3;
        for (let i = 0; i < residual.length; i += 3) {
          const a = Math.abs(residual[i]) + Math.abs(residual[i + 1]) + Math.abs(residual[i + 2]);
          if (a > maxA) maxA = a;
        }
        for (let p = 0, i = 0; p < NPIX; p++, i += 3) {
          const v = (Math.abs(residual[i]) + Math.abs(residual[i + 1]) + Math.abs(residual[i + 2])) / maxA;
          const g = Math.round(v * 255);
          const o = p * 4;
          d[o] = d[o + 1] = d[o + 2] = g; d[o + 3] = 255;
        }
        resCtx.putImageData(img, 0, 0);
      }

      function drawRecon() {
        const img = reconCtx.createImageData(W, H);
        floatRGBToImageData(recon, img);
        reconCtx.putImageData(img, 0, 0);
      }

      // ---------- 高斯评估 & 应用 ----------
      function evalGaussian(cx, cy, sx, sy, theta) {
        const cos = Math.cos(theta), sin = Math.sin(theta);
        const invSx2 = 1 / (sx * sx), invSy2 = 1 / (sy * sy);
        // 对极细椭圆，bbox 仍按较大轴，但阈值稍紧
        const rad = Math.ceil(3.0 * Math.max(sx, sy) + 1);
        const x0 = Math.max(0, Math.floor(cx - rad));
        const x1 = Math.min(W - 1, Math.ceil(cx + rad));
        const y0 = Math.max(0, Math.floor(cy - rad));
        const y1 = Math.min(H - 1, Math.ceil(cy + rad));

        let sumG2 = 0, sumR = 0, sumG = 0, sumB = 0;

        for (let y = y0; y <= y1; y++) {
          for (let x = x0; x <= x1; x++) {
            const dx = x - cx, dy = y - cy;
            const rx = dx * cos + dy * sin;
            const ry = -dx * sin + dy * cos;
            const g = Math.exp(-0.5 * (rx * rx * invSx2 + ry * ry * invSy2));
            if (g < 0.008) continue;
            const p = (y * W + x) * 3;
            sumG2 += g * g;
            sumR += residual[p] * g;
            sumG += residual[p + 1] * g;
            sumB += residual[p + 2] * g;
          }
        }
        return { sumG2, sumR, sumG, sumB };
      }

      function optimalColor(stats) {
        if (stats.sumG2 < 1e-6) return { r: 0, g: 0, b: 0, reduction: 0 };
        const r = stats.sumR / stats.sumG2;
        const g = stats.sumG / stats.sumG2;
        const b = stats.sumB / stats.sumG2;
        const reduction = (stats.sumR * stats.sumR + stats.sumG * stats.sumG + stats.sumB * stats.sumB) / stats.sumG2;
        return { r, g, b, reduction };
      }

      function applyGaussian(cx, cy, sx, sy, theta, color) {
        const cos = Math.cos(theta), sin = Math.sin(theta);
        const invSx2 = 1 / (sx * sx), invSy2 = 1 / (sy * sy);
        const rad = Math.ceil(3.0 * Math.max(sx, sy) + 1);
        const x0 = Math.max(0, Math.floor(cx - rad));
        const x1 = Math.min(W - 1, Math.ceil(cx + rad));
        const y0 = Math.max(0, Math.floor(cy - rad));
        const y1 = Math.min(H - 1, Math.ceil(cy + rad));

        for (let y = y0; y <= y1; y++) {
          for (let x = x0; x <= x1; x++) {
            const dx = x - cx, dy = y - cy;
            const rx = dx * cos + dy * sin;
            const ry = -dx * sin + dy * cos;
            const g = Math.exp(-0.5 * (rx * rx * invSx2 + ry * ry * invSy2));
            if (g < 0.008) continue;
            const p = (y * W + x) * 3;
            const dr = color.r * g, dg = color.g * g, db = color.b * g;
            recon[p] += dr;
            recon[p + 1] += dg;
            recon[p + 2] += db;
            residual[p] -= dr;
            residual[p + 1] -= dg;
            residual[p + 2] -= db;
          }
        }
      }

      // ---------- 启发式搜索（偏向圆形 + 长宽比惩罚） ----------
      // 长宽比惩罚：aspect = max(sx,sy)/min(sx,sy)
      // effective = reduction / (1 + λ * max(0, log(aspect) - log(τ))^2)
      // 这样接近圆的优先，只有误差下降明显更大时才接受细长椭圆
      const ASPECT_TAU = 2.2;   // 超过此长宽比开始惩罚
      const ASPECT_LAMBDA = 0.35; // 惩罚强度（适中，不过分压制细长）

      function aspectPenalty(sx, sy) {
        const a = Math.max(sx, sy) / Math.max(1e-6, Math.min(sx, sy));
        const excess = Math.max(0, Math.log(a) - Math.log(ASPECT_TAU));
        return 1 + ASPECT_LAMBDA * excess * excess;
      }

      function randomEllipse(preferThin = false) {
        const cx = Math.random() * W;
        const cy = Math.random() * H;
        let sx, sy, theta;

        // 细长候选概率大幅降低（约 8%）
        if (preferThin || Math.random() < 0.08) {
          // 允许细长，但不要极端到破坏画面
          const length = Math.exp(Math.random() * 3.2 + 0.6);   // ~1.8 – 30
          const thickness = Math.exp(Math.random() * 1.1 - 0.3); // ~0.7 – 2.5
          if (Math.random() < 0.5) {
            sx = Math.max(0.9, Math.min(70, length));
            sy = Math.max(0.7, Math.min(6, thickness));
          } else {
            sx = Math.max(0.7, Math.min(6, thickness));
            sy = Math.max(0.9, Math.min(70, length));
          }
          theta = Math.random() * Math.PI;
        } else {
          // 普通：偏向接近圆形（aspect 多在 1–2.5）
          const scale = Math.exp(Math.random() * 3.3 - 0.3); // ~0.7 – 25
          const aspect = Math.exp((Math.random() - 0.5) * 1.6); // ~0.45 – 2.2
          sx = Math.max(1.0, Math.min(80, scale * Math.sqrt(aspect)));
          sy = Math.max(1.0, Math.min(80, scale / Math.sqrt(aspect)));
          theta = Math.random() * Math.PI;
        }
        return { cx, cy, sx, sy, theta };
      }

      function mutate(e, strength) {
        // 尺度变异更温和，避免轻易拉成极细
        const n = {
          cx: e.cx + (Math.random() - 0.5) * 20 * strength,
          cy: e.cy + (Math.random() - 0.5) * 20 * strength,
          sx: e.sx * Math.exp((Math.random() - 0.5) * 0.55 * strength),
          sy: e.sy * Math.exp((Math.random() - 0.5) * 0.55 * strength),
          theta: e.theta + (Math.random() - 0.5) * 0.65 * strength
        };
        n.cx = Math.max(0, Math.min(W - 1, n.cx));
        n.cy = Math.max(0, Math.min(H - 1, n.cy));
        n.sx = Math.max(0.7, Math.min(90, n.sx));
        n.sy = Math.max(0.7, Math.min(90, n.sy));
        return n;
      }

      function scoreEllipse(e) {
        const stats = evalGaussian(e.cx, e.cy, e.sx, e.sy, e.theta);
        const col = optimalColor(stats);
        const penalty = aspectPenalty(e.sx, e.sy);
        // 用惩罚后的有效贡献做比较
        const effective = col.reduction / penalty;
        return { ...e, color: col, reduction: col.reduction, effective };
      }
      function findBestEllipse(numCand, numRefine) {
        // ---- 1. 从当前残差中提取“热点”锚点 ----
        function getAnchors(numAnchors = 30) {
          const sampleSize = Math.min(200, NPIX);
          const indices = new Uint32Array(sampleSize);
          for (let i = 0; i < sampleSize; i++) {
            indices[i] = Math.floor(Math.random() * NPIX);
          }
          // 计算残差强度
          const scores = new Float32Array(sampleSize);
          for (let i = 0; i < sampleSize; i++) {
            const idx = indices[i] * 3;
            scores[i] = Math.abs(residual[idx]) + Math.abs(residual[idx + 1]) + Math.abs(residual[idx + 2]);
          }
          // 排序找到最大的 numAnchors 个
          const sortedIndices = Array.from({ length: sampleSize }, (_, i) => i);
          sortedIndices.sort((a, b) => scores[b] - scores[a]);
          const anchors = [];
          const count = Math.min(numAnchors, sampleSize);
          for (let i = 0; i < count; i++) {
            const idx = indices[sortedIndices[i]];
            const x = idx % W;
            const y = Math.floor(idx / W);
            anchors.push({ x, y });
          }
          return anchors;
        }
        const anchors = getAnchors(30);

        // ---- 2. 生成候选椭圆的辅助函数 ----
        function randomEllipseFromAnchor(anchor) {
          // 中心在锚点附近随机偏移（±20px）
          const cx = Math.max(0, Math.min(W - 1, anchor.x + (Math.random() - 0.5) * 40));
          const cy = Math.max(0, Math.min(H - 1, anchor.y + (Math.random() - 0.5) * 40));
          // 尺度、角度仍使用原有随机策略（普通圆形倾向）
          const scale = Math.exp(Math.random() * 3.3 - 0.3);
          const aspect = Math.exp((Math.random() - 0.5) * 1.6);
          const sx = Math.max(1.0, Math.min(80, scale * Math.sqrt(aspect)));
          const sy = Math.max(1.0, Math.min(80, scale / Math.sqrt(aspect)));
          const theta = Math.random() * Math.PI;
          return { cx, cy, sx, sy, theta };
        }

        // ---- 3. 生成候选集（含细长） ----
        let best = null;
        const biasProb = 0.6; // 使用锚点的概率

        const thinCount = Math.max(4, Math.floor(numCand * 0.10));
        const normalCount = numCand - thinCount;

        // 普通候选（偏向圆形）
        for (let i = 0; i < normalCount; i++) {
          let e;
          if (Math.random() < biasProb && anchors.length > 0) {
            const anchor = anchors[Math.floor(Math.random() * anchors.length)];
            e = randomEllipseFromAnchor(anchor);
          } else {
            e = randomEllipse(false);
          }
          const scored = scoreEllipse(e);
          if (!best || scored.effective > best.effective) best = scored;
        }

        // 细长候选（保持原有比例）
        for (let i = 0; i < thinCount; i++) {
          let e;
          if (Math.random() < biasProb && anchors.length > 0) {
            const anchor = anchors[Math.floor(Math.random() * anchors.length)];
            e = randomEllipseFromAnchor(anchor);
          } else {
            e = randomEllipse(true);
          }
          const scored = scoreEllipse(e);
          if (!best || scored.effective > best.effective) best = scored;
        }

        // ---- 4. 局部爬山（不变） ----
        let cur = best;
        for (let r = 0; r < numRefine; r++) {
          const strength = 1.0 - r / (numRefine + 1);
          for (let t = 0; t < 5; t++) {
            const mut = scoreEllipse(mutate(cur, strength));
            if (mut.effective > cur.effective) cur = mut;
          }
        }
        return cur;
      }

      // ---------- 主分解 ----------
      async function decompose() {
        if (!target || running) return;
        running = true;
        btnStart.disabled = true;
        btnAnimate.disabled = true;
        btnSave.disabled = true;
        animating = false;

        const N = Math.max(5, Math.min(65536, +document.getElementById('numEllipses').value || 100));
        const nCand = Math.max(10, Math.min(300, +document.getElementById('numCandidates').value || 70));
        const nRefine = Math.max(0, Math.min(40, +document.getElementById('numRefine').value || 10));

        recon = new Float32Array(NPIX * 3);
        residual = new Float32Array(NPIX * 3);
        computeResidual();
        ellipses = [];

        drawRecon();
        drawResidual();

        let prevMSE = mse();
        log(`开始分解 · ${N} 椭圆 · ${nCand} 候选（含细长）+ ${nRefine} 爬山`);
        setProgress(0, '分解中…');

        const updateEvery = 1 //N > 300 ? 8 : (N > 100 ? 3 : 1);

        for (let k = 0; k < N; k++) {
          const best = findBestEllipse(nCand, nRefine);
          if (!best || best.reduction < 0.6) {
            log(`第 ${k + 1} 步增益过小，提前停止`);
            break;
          }

          applyGaussian(best.cx, best.cy, best.sx, best.sy, best.theta, best.color);
          ellipses.push({
            cx: best.cx, cy: best.cy, sx: best.sx, sy: best.sy, theta: best.theta,
            r: best.color.r, g: best.color.g, b: best.color.b,
            reduction: best.reduction
          });

          const curMSE = mse();
          if ((k + 1) % updateEvery === 0 || k === N - 1) {
            drawRecon();
            drawResidual();
            const pct = ((k + 1) / N) * 100;
            setProgress(pct, `已添加 ${k + 1}/${N} · MSE ${curMSE.toFixed(1)}`);
            document.getElementById('reconInfo').textContent = `椭圆 ${k + 1} · ↓${(prevMSE - curMSE).toFixed(1)}`;
            document.getElementById('resInfo').textContent = '残差';
            await new Promise(r => setTimeout(r, 0));
          }
          prevMSE = curMSE;
        }
        await refineShapes(8, 12);
        ellipses.sort((a, b) => b.reduction - a.reduction);
        log(`完成 · ${ellipses.length} 个椭圆 · 最终 MSE ${mse().toFixed(2)}`);
        setProgress(100, `完成 · ${ellipses.length} 椭圆`);
        btnStart.disabled = false;
        btnAnimate.disabled = ellipses.length === 0;
        btnSave.disabled = ellipses.length === 0;
        running = false;
      }
      // ---------- 全局形状+颜色联合微调（局部扰动爬山） ----------
      async function refineShapes(iterations = 3, perturbsPerEllipse = 6) {
        if (ellipses.length === 0) return;
        log(`开始形状+颜色联合微调 (${iterations} 轮，每轮每椭圆 ${perturbsPerEllipse} 次扰动)...`);

        // 先把当前重建清掉并重算一遍，保证残差精确（防止浮点误差累积）
        recon.fill(0);
        for (const e of ellipses) {
          applyGaussian(e.cx, e.cy, e.sx, e.sy, e.theta, { r: e.r, g: e.g, b: e.b });
        }
        computeResidual();

        for (let iter = 0; iter < iterations; iter++) {
          // 打乱处理顺序，避免固定的先后顺序影响结果
          const indices = ellipses.map((_, i) => i);
          for (let i = indices.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [indices[i], indices[j]] = [indices[j], indices[i]];
          }

          let acceptedCount = 0;
          for (const idx of indices) {
            const e = ellipses[idx];

            // 1. 把当前椭圆从画面中移除（相当于把它的贡献加回残差）
            applyGaussian(e.cx, e.cy, e.sx, e.sy, e.theta, { r: -e.r, g: -e.g, b: -e.b });

            // 2. 评估“原始形状”在当前残差下的表现（作为基准线）
            const oldStats = evalGaussian(e.cx, e.cy, e.sx, e.sy, e.theta);
            const oldCol = optimalColor(oldStats);
            const oldGain = oldCol.reduction;

            // 3. 初始化最佳候选为原始形状
            let bestCx = e.cx, bestCy = e.cy, bestSx = e.sx, bestSy = e.sy, bestTheta = e.theta;
            let bestCol = oldCol;
            let bestGain = oldGain;

            // 4. 尝试若干次随机扰动（微动）
            for (let p = 0; p < perturbsPerEllipse; p++) {
              // 变异强度用 0.4，比搜索时更温柔，只做微调
              const mutated = mutate(e, 0.4);
              // 确保不超出边界（mutate 里已经有 clamp）
              const stats = evalGaussian(mutated.cx, mutated.cy, mutated.sx, mutated.sy, mutated.theta);
              const col = optimalColor(stats);

              // 注意：这里要用带长宽比惩罚的有效增益（effective）比较，保持一致
              const penalty = aspectPenalty(mutated.sx, mutated.sy);
              const effective = col.reduction / penalty;

              // 原形状也要算有效增益
              const oldPenalty = aspectPenalty(e.sx, e.sy);
              const oldEffective = oldGain / oldPenalty;

              if (effective > oldEffective) {
                // 只记录最佳扰动（实际微调幅度不会太大）
                if (col.reduction > bestGain) {
                  bestGain = col.reduction;
                  bestCol = col;
                  bestCx = mutated.cx;
                  bestCy = mutated.cy;
                  bestSx = mutated.sx;
                  bestSy = mutated.sy;
                  bestTheta = mutated.theta;
                }
              }
            }

            // 5. 如果找到了明显更好的形状（增益提升超过 2%），则接受微动
            if (bestGain > oldGain * 1.02) {
              // 用新形状和新颜色应用回去
              applyGaussian(bestCx, bestCy, bestSx, bestSy, bestTheta, { r: bestCol.r, g: bestCol.g, b: bestCol.b });
              // 更新存储的数据
              e.cx = bestCx; e.cy = bestCy;
              e.sx = bestSx; e.sy = bestSy;
              e.theta = bestTheta;
              e.r = bestCol.r; e.g = bestCol.g; e.b = bestCol.b;
              e.reduction = bestCol.reduction;
              acceptedCount++;
            } else {
              // 没有更好的扰动，就原封不动贴回去
              applyGaussian(e.cx, e.cy, e.sx, e.sy, e.theta, { r: e.r, g: e.g, b: e.b });
            }
          }

          // 每轮结束后刷新界面
          drawRecon();
          drawResidual();
          const pct = 60 + ((iter + 1) / iterations) * 30;
          setProgress(pct, `形状微调 ${iter + 1}/${iterations} · 接受 ${acceptedCount} 个改动 · MSE ${mse().toFixed(2)}`);
          log(`微调第 ${iter + 1} 轮：${acceptedCount} 个椭圆发生了微动`);
          await new Promise(r => setTimeout(r, 0));
        }

        // 最后按贡献重新排序（好看）
        log(`形状微调结束 · 最终 MSE ${mse().toFixed(2)}`);
      }

      // ---------- 动画 ----------
      async function playAnimation() {
        if (!ellipses.length || animating) return;
        animating = true;
        btnAnimate.disabled = true;
        btnStart.disabled = true;

        recon.fill(0);
        if (target) computeResidual();

        const reconData = reconCtx.createImageData(W, H);
        for (let i = 3; i < reconData.data.length; i += 4) reconData.data[i] = 255;

        log(`动画：按贡献叠加 ${ellipses.length} 个高斯`);
        setProgress(0, '动画中…');

        const step = ellipses.length > 600 ? 4 : (ellipses.length > 200 ? 2 : 1);
        for (let k = 0; k < ellipses.length; k++) {
          const e = ellipses[k];
          applyGaussian(e.cx, e.cy, e.sx, e.sy, e.theta, { r: e.r, g: e.g, b: e.b });
          if ((k + 1) % step === 0 || k === ellipses.length - 1) {
            floatRGBToImageData(recon, reconData);
            reconCtx.putImageData(reconData, 0, 0);
            const pct = ((k + 1) / ellipses.length) * 100;
            setProgress(pct, `叠加 ${k + 1}/${ellipses.length}`);
            document.getElementById('reconInfo').textContent = `贡献第 ${k + 1} 大`;
            const delay = ellipses.length > 400 ? 6 : (k < 12 ? 100 : 20);
            await new Promise(r => setTimeout(r, delay));
          }
        }

        if (target) {
          computeResidual();
          drawResidual();
        }
        setProgress(100, '动画完成');
        log('叠加动画结束');
        animating = false;
        btnAnimate.disabled = false;
        btnStart.disabled = false;
      }

      // ---------- 紧凑量化二进制 v2（16 字节/椭圆） ----------
      // 布局 (little-endian):
      // Header 16B:
      //   magic "GS2D" (4)
      //   version uint16 = 2
      //   width  uint16
      //   height uint16
      //   count  uint32
      //   reserved uint16 = 0
      //
      // 每个椭圆 16B:
      //   cx_q   uint16   // cx * 128  → 精度 ~0.0078 px，范围 0–511.99
      //   cy_q   uint16
      //   lsx_q  int16    // round(log2(sx) * 512)   支持 sx ≈ 0.5–128
      //   lsy_q  int16
      //   th_q   uint16   // theta / π * 65535
      //   r_q    int16    // clamp(round(r), -32768..32767)
      //   g_q    int16
      //   b_q    int16
      //
      // 解码时反量化即可。总大小 = 16 + 16 * N

      // 颜色定点：存 round(c * COLOR_SCALE)，读时 /COLOR_SCALE
      // 精度 1/64 ≈ 0.015，范围约 ±512，对振幅足够且色偏极小
      const COLOR_SCALE = 64;

      function quantizeLogScale(s) {
        const v = Math.log2(Math.max(0.4, Math.min(140, s))) * 512;
        return Math.max(-32768, Math.min(32767, Math.round(v)));
      }
      function dequantizeLogScale(q) {
        return Math.pow(2, q / 512);
      }
      function quantizeColor(c) {
        return Math.max(-32768, Math.min(32767, Math.round(c * COLOR_SCALE)));
      }
      function dequantizeColor(q) {
        return q / COLOR_SCALE;
      }
      // 角度：uint16 映射 [0, π)，椭圆方向 π 周期，精度 ≈0.0027°
      function quantizeTheta(th) {
        let t = th % Math.PI;
        if (t < 0) t += Math.PI;
        return Math.max(0, Math.min(65535, Math.round((t / Math.PI) * 65535)));
      }
      function dequantizeTheta(q) {
        return (q / 65535) * Math.PI;
      }

      function saveBinary() {
        if (!ellipses.length) return;
        const count = ellipses.length;
        const buf = new ArrayBuffer(16 + 16 * count);
        const view = new DataView(buf);

        // header
        view.setUint8(0, 0x47); view.setUint8(1, 0x53);
        view.setUint8(2, 0x32); view.setUint8(3, 0x44);
        view.setUint16(4, 2, true);          // version 2
        view.setUint16(6, W, true);
        view.setUint16(8, H, true);
        view.setUint32(10, count, true);
        view.setUint16(14, 0, true);

        let off = 16;
        for (const e of ellipses) {
          const cxq = Math.max(0, Math.min(65535, Math.round(e.cx * 128)));
          const cyq = Math.max(0, Math.min(65535, Math.round(e.cy * 128)));
          const lsxq = quantizeLogScale(e.sx);
          const lsyq = quantizeLogScale(e.sy);
          const thq = quantizeTheta(e.theta);
          const rq = quantizeColor(e.r);
          const gq = quantizeColor(e.g);
          const bq = quantizeColor(e.b);

          view.setUint16(off, cxq, true); off += 2;
          view.setUint16(off, cyq, true); off += 2;
          view.setInt16(off, lsxq, true); off += 2;
          view.setInt16(off, lsyq, true); off += 2;
          view.setUint16(off, thq, true); off += 2;
          view.setInt16(off, rq, true); off += 2;
          view.setInt16(off, gq, true); off += 2;
          view.setInt16(off, bq, true); off += 2;
        }

        const blob = new Blob([buf], { type: 'application/octet-stream' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `splats_${W}x${H}_${count}_v2.gs2d`;
        a.click();
        URL.revokeObjectURL(url);
        log(`已保存 v2 · ${count} 椭圆 · ${(buf.byteLength / 1024).toFixed(1)} KB（16 B/椭圆，颜色×${COLOR_SCALE}，角度归一化）`);
      }

      function loadBinary(file) {
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const buf = reader.result;
            const view = new DataView(buf);
            if (view.byteLength < 16) throw new Error('文件过短');

            const magic = String.fromCharCode(view.getUint8(0), view.getUint8(1), view.getUint8(2), view.getUint8(3));
            if (magic !== 'GS2D') throw new Error('不是有效的 GS2D 文件');

            const ver = view.getUint16(4, true);
            const w = view.getUint16(6, true);
            const h = view.getUint16(8, true);
            const count = view.getUint32(10, true);

            if (w !== W || h !== H) {
              log(`警告：文件 ${w}×${h}，当前固定 ${W}×${H}`);
            }

            const loaded = [];
            let off = 16;

            if (ver === 2) {
              if (16 + 16 * count > view.byteLength) throw new Error('v2 数据长度不足');
              for (let i = 0; i < count; i++) {
                const cx = view.getUint16(off, true) / 128; off += 2;
                const cy = view.getUint16(off, true) / 128; off += 2;
                const sx = dequantizeLogScale(view.getInt16(off, true)); off += 2;
                const sy = dequantizeLogScale(view.getInt16(off, true)); off += 2;
                const theta = dequantizeTheta(view.getUint16(off, true)); off += 2;
                const r = dequantizeColor(view.getInt16(off, true)); off += 2;
                const g = dequantizeColor(view.getInt16(off, true)); off += 2;
                const b = dequantizeColor(view.getInt16(off, true)); off += 2;
                loaded.push({ cx, cy, sx, sy, theta, r, g, b, reduction: 0 });
              }
            } else if (ver === 1) {
              // 兼容旧的 32B float32 格式
              if (16 + 32 * count > view.byteLength) throw new Error('v1 数据长度不足');
              for (let i = 0; i < count; i++) {
                const e = {
                  cx: view.getFloat32(off, true), cy: view.getFloat32(off + 4, true),
                  sx: view.getFloat32(off + 8, true), sy: view.getFloat32(off + 12, true),
                  theta: view.getFloat32(off + 16, true),
                  r: view.getFloat32(off + 20, true), g: view.getFloat32(off + 24, true),
                  b: view.getFloat32(off + 28, true), reduction: 0
                };
                loaded.push(e);
                off += 32;
              }
            } else {
              throw new Error('不支持的版本 ' + ver);
            }

            ellipses = loaded;
            recon = new Float32Array(NPIX * 3);
            residual = new Float32Array(NPIX * 3);
            if (target) computeResidual();
            else residual.fill(0);

            for (const e of ellipses) {
              applyGaussian(e.cx, e.cy, e.sx, e.sy, e.theta, { r: e.r, g: e.g, b: e.b });
            }
            drawRecon();
            if (target) {
              computeResidual();
              drawResidual();
            } else {
              resCtx.fillStyle = '#000';
              resCtx.fillRect(0, 0, W, H);
            }

            document.getElementById('reconInfo').textContent = `已加载 ${count} 个椭圆 (v${ver})`;
            document.getElementById('resInfo').textContent = target ? '残差' : '无目标图';
            btnAnimate.disabled = false;
            btnSave.disabled = false;
            btnStart.disabled = !target;
            setProgress(100, `已加载 ${count} 椭圆`);
            log(`成功加载 v${ver} · ${count} 椭圆 · ${(buf.byteLength / 1024).toFixed(1)} KB`);
          } catch (err) {
            log('加载失败: ' + err.message);
            alert('加载失败: ' + err.message);
          }
        };
        reader.readAsArrayBuffer(file);
      }

      // ---------- 示例 & 上传 ----------
      function generateSample() {
        // 彩色填色简笔画：房子、树、太阳、气球、花、草地
        srcCtx.fillStyle = '#12151c';
        srcCtx.fillRect(0, 0, W, H);
        srcCtx.lineCap = 'round';
        srcCtx.lineJoin = 'round';

        // 太阳
        srcCtx.fillStyle = '#f5c542';
        srcCtx.beginPath();
        srcCtx.arc(420, 90, 42, 0, Math.PI * 2);
        srcCtx.fill();
        srcCtx.strokeStyle = '#e8a820';
        srcCtx.lineWidth = 3;
        srcCtx.stroke();
        srcCtx.strokeStyle = '#f0b830';
        srcCtx.lineWidth = 4;
        for (let i = 0; i < 8; i++) {
          const a = i * Math.PI / 4;
          srcCtx.beginPath();
          srcCtx.moveTo(420 + Math.cos(a) * 52, 90 + Math.sin(a) * 52);
          srcCtx.lineTo(420 + Math.cos(a) * 72, 90 + Math.sin(a) * 72);
          srcCtx.stroke();
        }

        // 草地
        srcCtx.fillStyle = '#3a9e5c';
        srcCtx.fillRect(0, 380, W, 132);
        srcCtx.fillStyle = '#2d8a4e';
        srcCtx.beginPath();
        srcCtx.moveTo(0, 380);
        for (let x = 0; x <= W; x += 40) {
          srcCtx.quadraticCurveTo(x + 20, 360 + (x % 80 === 0 ? 8 : -6), x + 40, 380);
        }
        srcCtx.lineTo(W, 512);
        srcCtx.lineTo(0, 512);
        srcCtx.closePath();
        srcCtx.fill();

        // 房子主体
        srcCtx.fillStyle = '#e8c4a0';
        srcCtx.fillRect(70, 260, 150, 140);
        srcCtx.strokeStyle = '#c49a70';
        srcCtx.lineWidth = 3;
        srcCtx.strokeRect(70, 260, 150, 140);

        // 屋顶
        srcCtx.fillStyle = '#d94f3d';
        srcCtx.beginPath();
        srcCtx.moveTo(55, 260);
        srcCtx.lineTo(145, 190);
        srcCtx.lineTo(235, 260);
        srcCtx.closePath();
        srcCtx.fill();
        srcCtx.strokeStyle = '#b33d2e';
        srcCtx.lineWidth = 3;
        srcCtx.stroke();

        // 门
        srcCtx.fillStyle = '#6b3e2e';
        srcCtx.fillRect(125, 330, 40, 70);
        srcCtx.fillStyle = '#f0d060';
        srcCtx.beginPath();
        srcCtx.arc(155, 365, 4, 0, Math.PI * 2);
        srcCtx.fill();

        // 窗户
        srcCtx.fillStyle = '#7ec8e8';
        srcCtx.fillRect(90, 285, 36, 36);
        srcCtx.fillRect(164, 285, 36, 36);
        srcCtx.strokeStyle = '#5aa0c0';
        srcCtx.lineWidth = 2;
        srcCtx.strokeRect(90, 285, 36, 36);
        srcCtx.strokeRect(164, 285, 36, 36);
        srcCtx.beginPath();
        srcCtx.moveTo(108, 285); srcCtx.lineTo(108, 321);
        srcCtx.moveTo(90, 303); srcCtx.lineTo(126, 303);
        srcCtx.moveTo(182, 285); srcCtx.lineTo(182, 321);
        srcCtx.moveTo(164, 303); srcCtx.lineTo(200, 303);
        srcCtx.stroke();

        // 树
        srcCtx.fillStyle = '#8b5a2b';
        srcCtx.fillRect(320, 300, 24, 90);
        srcCtx.fillStyle = '#2e8b57';
        srcCtx.beginPath();
        srcCtx.arc(332, 270, 48, 0, Math.PI * 2);
        srcCtx.fill();
        srcCtx.fillStyle = '#3cb371';
        srcCtx.beginPath();
        srcCtx.arc(310, 290, 32, 0, Math.PI * 2);
        srcCtx.arc(354, 290, 32, 0, Math.PI * 2);
        srcCtx.fill();

        // 彩色气球
        const balloons = [
          { x: 280, y: 160, r: 28, c: '#e74c6f' },
          { x: 310, y: 130, r: 24, c: '#5b8def' },
          { x: 255, y: 145, r: 22, c: '#f0c040' },
        ];
        for (const b of balloons) {
          srcCtx.fillStyle = b.c;
          srcCtx.beginPath();
          srcCtx.ellipse(b.x, b.y, b.r * 0.85, b.r, 0, 0, Math.PI * 2);
          srcCtx.fill();
          srcCtx.strokeStyle = 'rgba(0,0,0,0.25)';
          srcCtx.lineWidth = 2;
          srcCtx.stroke();
          srcCtx.strokeStyle = '#aaa';
          srcCtx.lineWidth = 1.5;
          srcCtx.beginPath();
          srcCtx.moveTo(b.x, b.y + b.r);
          srcCtx.quadraticCurveTo(b.x + 10, b.y + b.r + 40, 300, 300);
          srcCtx.stroke();
        }

        // 云
        srcCtx.fillStyle = '#dce6f5';
        function cloud(cx, cy, s) {
          srcCtx.beginPath();
          srcCtx.arc(cx, cy, 22 * s, 0, Math.PI * 2);
          srcCtx.arc(cx + 28 * s, cy - 6 * s, 26 * s, 0, Math.PI * 2);
          srcCtx.arc(cx + 56 * s, cy, 20 * s, 0, Math.PI * 2);
          srcCtx.fill();
        }
        cloud(90, 80, 1.1);
        cloud(200, 55, 0.85);

        // 小路
        srcCtx.fillStyle = '#c2a878';
        srcCtx.beginPath();
        srcCtx.moveTo(145, 400);
        srcCtx.quadraticCurveTo(200, 450, 180, 512);
        srcCtx.lineTo(230, 512);
        srcCtx.quadraticCurveTo(250, 450, 195, 400);
        srcCtx.closePath();
        srcCtx.fill();

        // 小花
        const flowers = [
          { x: 50, y: 430, c: '#e85d8e' },
          { x: 380, y: 450, c: '#f0a030' },
          { x: 450, y: 420, c: '#c060e0' },
          { x: 40, y: 480, c: '#50c0e0' },
        ];
        for (const f of flowers) {
          srcCtx.fillStyle = f.c;
          for (let i = 0; i < 5; i++) {
            const a = i * Math.PI * 2 / 5 - Math.PI / 2;
            srcCtx.beginPath();
            srcCtx.ellipse(f.x + Math.cos(a) * 10, f.y + Math.sin(a) * 10, 7, 5, a, 0, Math.PI * 2);
            srcCtx.fill();
          }
          srcCtx.fillStyle = '#f5e050';
          srcCtx.beginPath();
          srcCtx.arc(f.x, f.y, 5, 0, Math.PI * 2);
          srcCtx.fill();
        }

        const imgData = srcCtx.getImageData(0, 0, W, H);
        target = imageDataToFloatRGB(imgData);
        document.getElementById('srcInfo').textContent = '示例图像';
        resetState();
        log('已生成彩色填色示例（房子、树、太阳、气球、花）');
      }

      function loadFile(file) {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          const size = Math.min(img.width, img.height);
          const sx = (img.width - size) / 2, sy = (img.height - size) / 2;
          srcCtx.drawImage(img, sx, sy, size, size, 0, 0, W, H);
          const imgData = srcCtx.getImageData(0, 0, W, H);
          target = imageDataToFloatRGB(imgData);
          document.getElementById('srcInfo').textContent = file.name + ' → 512×512';
          resetState();
          log(`已加载并缩放到 512×512: ${file.name}`);
          URL.revokeObjectURL(url);
        };
        img.src = url;
      }

      function resetState() {
        recon = new Float32Array(NPIX * 3);
        residual = new Float32Array(NPIX * 3);
        if (target) computeResidual();
        ellipses = [];
        reconCtx.fillStyle = '#000';
        reconCtx.fillRect(0, 0, W, H);
        resCtx.fillStyle = '#000';
        resCtx.fillRect(0, 0, W, H);
        btnStart.disabled = !target;
        btnAnimate.disabled = true;
        btnSave.disabled = true;
        setProgress(0, '就绪');
        document.getElementById('reconInfo').textContent = '—';
        document.getElementById('resInfo').textContent = '—';
      }

      document.getElementById('fileInput').addEventListener('change', e => {
        const f = e.target.files[0];
        if (f) loadFile(f);
      });
      document.getElementById('binInput').addEventListener('change', e => {
        const f = e.target.files[0];
        if (f) loadBinary(f);
      });
      document.getElementById('btnSample').addEventListener('click', generateSample);
      btnStart.addEventListener('click', () => decompose());
      btnAnimate.addEventListener('click', () => playAnimation());
      btnSave.addEventListener('click', () => saveBinary());

      generateSample();
    })();
  </script>
