                            <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LUMINA — MIDI Visualizer</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--glass:rgba(16,18,32,.55);--border:rgba(255,255,255,.10);--text:#e8ecff;--dim:#8d94b8;--accent:#8fa8ff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#04050b;color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.bar,.panel{position:fixed;left:16px;right:16px;z-index:5;background:var(--glass);backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);border:1px solid var(--border);border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06);transition:opacity .6s,transform .6s}
.bar{top:14px;display:flex;gap:8px;align-items:center;padding:9px 12px;flex-wrap:wrap}
.panel{bottom:14px;padding:10px 14px 12px}
body.idle .bar{opacity:0;transform:translateY(-20px);pointer-events:none}
body.idle .panel{opacity:0;transform:translateY(20px);pointer-events:none}
body.idle{cursor:none}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.32em;font-size:13px;margin-right:6px;background:linear-gradient(90deg,#9fb4ff,#f0a6ff,#7ff0d6);-webkit-background-clip:text;background-clip:text;color:transparent}
.orb{width:16px;height:16px;border-radius:50%;background:conic-gradient(from 0deg,#ff4d6d,#ffb703,#3ddc97,#4cc9f0,#b388ff,#ff4d6d);box-shadow:0 0 14px #b388ff;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn,select,.tabs button{font:inherit;font-size:13px;color:var(--text);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:11px;padding:7px 12px;cursor:pointer;transition:background .2s,border-color .2s,box-shadow .2s;outline:none}
.btn:hover,select:hover,.tabs button:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2)}
.btn.icon{width:36px;padding:7px 0;text-align:center}
.btn.on{background:rgba(143,168,255,.25);border-color:rgba(143,168,255,.6);box-shadow:0 0 14px rgba(143,168,255,.35)}
#play{background:linear-gradient(135deg,#6d7dff,#c86dff);border:none;box-shadow:0 0 18px rgba(160,110,255,.5)}
select{appearance:none;padding-right:26px;background-image:linear-gradient(45deg,transparent 50%,#aab 50%),linear-gradient(135deg,#aab 50%,transparent 50%);background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;background-size:5px 5px;background-repeat:no-repeat;max-width:230px}
select option{background:#151827}
.sep{width:1px;height:24px;background:var(--border);margin:0 4px}
.grow{flex:1}
.lbl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.12em}
.tabs{display:flex;background:rgba(0,0,0,.25);padding:3px;border-radius:13px;gap:3px}
.tabs button{border:none;background:transparent;border-radius:10px;padding:6px 14px}
.tabs button.on{background:linear-gradient(135deg,rgba(109,125,255,.55),rgba(200,109,255,.55));box-shadow:0 0 16px rgba(160,110,255,.45)}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px;font-size:13px}
#title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hint{color:var(--dim);font-size:12px;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#time{font-variant-numeric:tabular-nums;color:var(--dim)}
.mini{position:relative;height:44px;border-radius:10px;overflow:hidden;background:rgba(0,0,0,.35);cursor:pointer}
#mini{width:100%;height:100%;display:block}
#ph{position:absolute;top:0;bottom:0;width:2px;left:0;background:#fff;box-shadow:0 0 10px #fff,0 0 22px #b388ff;pointer-events:none}
#shade{position:absolute;top:0;bottom:0;left:0;background:rgba(255,255,255,.06);pointer-events:none}
.drop{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:3;pointer-events:none;transition:opacity .4s}
.drop.hide{opacity:0}
.drop .card{text-align:center;padding:46px 60px;border-radius:28px;border:1.5px dashed rgba(170,180,255,.3);background:rgba(10,12,24,.35);backdrop-filter:blur(6px)}
.drop.drag .card{border-color:#c79bff;box-shadow:0 0 60px rgba(180,120,255,.4)}
.big{font-size:34px;font-weight:800;letter-spacing:.02em;background:linear-gradient(90deg,#9fb4ff,#f0a6ff,#7ff0d6);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin-top:10px;color:var(--dim)}
.keys{margin-top:18px;font-size:12px;color:#6c7399;letter-spacing:.05em}
#toast{position:fixed;left:50%;top:84px;transform:translate(-50%,-10px);background:rgba(20,22,40,.85);border:1px solid var(--border);padding:9px 16px;border-radius:12px;font-size:13px;opacity:0;transition:.35s;z-index:10;pointer-events:none;backdrop-filter:blur(10px)}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="bar" id="top">
  <div class="logo"><span class="orb"></span>LUMINA</div>
  <label class="btn" title="Open MIDI file">📂 Open<input type="file" id="file" accept=".mid,.midi,.kar,.rmi,audio/midi" hidden></label>
  <button class="btn" id="demo" title="Generate a demo song">✨ Demo</button>
  <div class="sep"></div>
  <button class="btn icon" id="play" title="Play / Pause (Space)">▶</button>
  <button class="btn icon" id="stop" title="Stop">■</button>
  <button class="btn icon" id="loop" title="Loop">⟲</button>
  <select id="speed" title="Speed">
    <option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option>
    <option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option>
  </select>
  <div class="sep"></div>
  <div class="tabs" id="tabs">
    <button data-m="0" class="on">▤ Cascade</button>
    <button data-m="1">✺ Orbit</button>
    <button data-m="2">◎ Warp</button>
    <button data-m="3">❋ Trail</button>
  </div>
  <div class="grow"></div>
  <span class="lbl">Output</span>
  <select id="out"><option value="synth">🎹 Built-in synth</option></select>
  <button class="btn icon" id="fs" title="Fullscreen (F)">⛶</button>
</div>

<div class="panel" id="bottom">
  <div class="meta"><span id="title">No file loaded</span><span id="hint"></span><span id="time">0:00 / 0:00</span></div>
  <div class="mini" id="miniWrap"><canvas id="mini"></canvas><div id="shade"></div><div id="ph"></div></div>
</div>

<div class="drop" id="drop"><div class="card">
  <div class="big">Drop a MIDI file</div>
  <div class="sub">or click <b>Open</b> — or try the <b>✨ Demo</b></div>
  <div class="keys">SPACE play · 1 2 3 4 modes · ← → seek · F fullscreen · wheel zoom</div>
</div></div>
<div id="toast"></div>

<script>
"use strict";
/* ============================== utils ============================== */
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
const cv = $('#c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
const NOTE_NAMES = ['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];
const isBlack = n => [1,3,6,8,10].includes(((n % 12) + 12) % 12);
const FIFTH = Array.from({length:12}, (_, pc) => (pc * 7) % 12); // position on circle of fifths
const PAL_HEX = ['#ff4d6d','#ffb703','#3ddc97','#4cc9f0','#b388ff','#ff7b00','#00f5d4','#f72585',
                 '#a3e635','#f1f5ff','#60a5fa','#fb7185','#facc15','#34d399','#c084fc','#f97316'];
const PAL = PAL_HEX.map(h => [1,3,5].map(i => parseInt(h.substr(i,2),16)).join(','));
const fmt = s => { s = Math.max(0, s|0); return (s/60|0) + ':' + String(s%60).padStart(2,'0'); };
const lb = (arr, v, f) => { let l = 0, h = arr.length; while (l < h) { const m = (l+h) >> 1; if (f(arr[m]) < v) l = m+1; else h = m; } return l; };
const rand = (a, b) => a + Math.random() * (b - a);

function makeGlow(rgb) {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'); const gr = g.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.12, `rgba(${rgb},0.95)`);
  gr.addColorStop(0.4, `rgba(${rgb},0.28)`); gr.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = gr; g.fillRect(0,0,128,128); return c;
}
const GLOW = PAL.map(makeGlow);
function glow(ch, x, y, size, a = 1) {
  if (a <= 0.003) return;
  ctx.globalAlpha = Math.min(1, a); ctx.drawImage(GLOW[ch], x - size/2, y - size/2, size, size); ctx.globalAlpha = 1;
}
function rr(x, y, w, h, r) { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w/2, h/2))); else ctx.rect(x, y, w, h); }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2600); }

/* ============================== MIDI parsing ============================== */
function parseMIDI(buf) {
  const d = new DataView(buf), u = new Uint8Array(buf); let p = -1;
  for (let i = 0; i < Math.min(u.length - 4, 8192); i++) if (u[i]===0x4D&&u[i+1]===0x54&&u[i+2]===0x68&&u[i+3]===0x64) { p = i; break; }
  if (p < 0) throw new Error('Not a Standard MIDI File');
  const u8 = () => d.getUint8(p++);
  const u16 = () => { const v = d.getUint16(p); p += 2; return v; };
  const u32 = () => { const v = d.getUint32(p); p += 4; return v; };
  const str = n => { let s = ''; for (let i = 0; i < n && p + i < u.length; i++) s += String.fromCharCode(u[p+i]); p += n; return s; };
  const vlq = () => { let v = 0, b, guard = 0; do { b = u8(); v = (v << 7) | (b & 0x7f); } while (b & 0x80 && ++guard < 4); return v; };
  p += 4; const hlen = u32(); const hs = p; u16(); const ntr = u16(); const div = u16(); p = hs + hlen;
  const raw = []; let name = '', seq = 0, bpb = 0, trk = 0;
  while (trk < ntr && p + 8 <= u.length) {
    const id = str(4), len = u32(), end = Math.min(p + len, u.length);
    if (id !== 'MTrk') { p = end; continue; }
    let tick = 0, run = 0;
    while (p < end) {
      tick += vlq();
      let st = u[p];
      if (st & 0x80) p++; else { if (!run) { p++; continue; } st = run; }
      if (st === 0xFF) {
        const ty = u8(), l = vlq(), ds = p;
        if (ty === 0x51 && l === 3) raw.push({tick, tempo:(u[p]<<16)|(u[p+1]<<8)|u[p+2], o:seq++});
        else if (ty === 0x03 && !name && trk < 2) name = str(l).trim();
        else if (ty === 0x58 && !bpb) bpb = u[p];
        p = ds + l; if (ty === 0x2F) break;
      } else if (st === 0xF0 || st === 0xF7) { const l = vlq(); p += l; }
      else {
        run = st; const hi = st & 0xF0; const d1 = u8() & 127;
        const data = (hi === 0xC0 || hi === 0xD0) ? [st, d1] : [st, d1, u8() & 127];
        raw.push({tick, data, o:seq++});
      }
    }
    p = end; trk++;
  }
  raw.sort((a, b) => a.tick - b.tick || ((b.tempo?1:0) - (a.tempo?1:0)) || a.o - b.o);
  // tempo map
  const smpte = div & 0x8000; const tpq = smpte ? 0 : div;
  let spt = smpte ? 1 / ((256 - (div >> 8)) * (div & 0xff)) : 0.5 / tpq;
  const tempos = [{tick:0, sec:0, spt}];
  let lastTick = 0, sec = 0; const ev = [];
  for (const e of raw) {
    sec += (e.tick - lastTick) * spt; lastTick = e.tick; e.t = sec;
    if (e.tempo) { if (!smpte) { spt = e.tempo / 1e6 / tpq; tempos.push({tick:e.tick, sec, spt}); } }
    else ev.push({t:sec, data:e.data, o:e.o});
  }
  const beats = [];
  if (!smpte) {
    let ti = 0;
    for (let b = 0; b <= lastTick + tpq; b += tpq) {
      while (ti + 1 < tempos.length && tempos[ti+1].tick <= b) ti++;
      const T = tempos[ti]; beats.push(T.sec + (b - T.tick) * T.spt);
    }
  } else for (let s = 0; s <= sec + 1; s += 0.5) beats.push(s);
  return buildSong(ev, beats, name, bpb || 4);
}

function buildSong(ev, beats, name, bpb = 4) {
  ev.sort((a, b) => a.t - b.t || a.o - b.o);
  const notes = [], evs = [], open = new Map(); let lo = 127, hi = 0, end = 0;
  for (const e of ev) {
    const d = e.data, st = d[0] & 0xF0, ch = d[0] & 15;
    evs.push({t:e.t, data:d}); end = Math.max(end, e.t);
    if (st === 0x90 && d[2] > 0) {
      const n = {start:e.t, end:-1, note:d[1], vel:d[2], ch}; notes.push(n);
      const k = ch * 128 + d[1]; let a = open.get(k); if (!a) open.set(k, a = []); a.push(n);
      if (d[1] < lo) lo = d[1]; if (d[1] > hi) hi = d[1];
    } else if (st === 0x80 || st === 0x90) {
      const a = open.get(ch * 128 + d[1]); if (a && a.length) a.shift().end = e.t;
    }
  }
  let maxDur = 0, dur = end;
  for (const n of notes) {
    if (n.end < 0) n.end = Math.max(end, n.start + 1);
    if (n.end - n.start < 0.04) n.end = n.start + 0.04;
    maxDur = Math.max(maxDur, n.end - n.start); dur = Math.max(dur, n.end);
  }
  notes.sort((a, b) => a.start - b.start);
  if (!notes.length) { lo = 48; hi = 72; }
  lo = Math.max(0, lo - 2); hi = Math.min(127, hi + 2);
  while (hi - lo < 24 && (lo > 0 || hi < 127)) { lo = Math.max(0, lo - 1); hi = Math.min(127, hi + 1); }
  if (isBlack(lo) && lo > 0) lo--; if (isBlack(hi) && hi < 127) hi++;
  const chans = new Set(notes.map(n => n.ch));
  return {name, notes, evs, beats, bpb, lo, hi, dur: dur + 0.3, maxDur, chans};
}

/* ============================== demo song ============================== */
function demoSong() {
  const ev = [], bt = 60 / 96; let s = 1234567;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const add = (t, dur, ch, n, v) => { ev.push({t, data:[0x90|ch, n, v], o:1}); ev.push({t:t+dur, data:[0x80|ch, n, 0], o:0}); };
  [[0,0],[1,33],[2,81],[3,89],[4,11]].forEach(([c,p]) => ev.push({t:0, data:[0xC0|c, p], o:-1}));
  const prog = [[57,60,64,69],[53,57,60,65],[48,52,55,60],[55,59,62,67],[50,53,57,62],[53,57,60,65],[52,56,59,64],[52,56,59,64]];
  const penta = [64,67,69,72,74,76,79,81,84];
  const bars = 32; let mi = 4;
  for (let bar = 0; bar < bars; bar++) {
    const ch = prog[bar % 8], t0 = bar * 4 * bt;
    ch.slice(0, 3).forEach(n => add(t0, 4*bt*0.98, 3, n, 42));
    if (bar >= 2) for (let i = 0; i < 16; i++) add(t0 + i*bt/4, bt/4*0.9, 0, ch[[0,1,2,3,2,1,2,3][i%8]] + 12, 55 + (i%4===0 ? 30 : 0));
    if (bar >= 4) for (let i = 0; i < 4; i++) add(t0 + i*bt, bt*0.85, 1, ch[0] - 24 + (i===3 ? 12 : 0), 100);
    if (bar >= 4 && bar < bars - 1) {
      for (let i = 0; i < 8; i++) add(t0 + i*bt/2, 0.05, 9, 42, i%2 ? 50 : 85);
      [0, 2, 2.5].forEach(b => add(t0 + b*bt, 0.1, 9, 36, 115));
      [1, 3].forEach(b => add(t0 + b*bt, 0.1, 9, 38, 100));
      if (bar % 8 === 4) add(t0, 1, 9, 49, 100);
    }
    if (bar >= 8 && bar < bars - 2) {
      let tt = 0;
      while (tt < 4) {
        const d = [0.5, 0.5, 1, 1, 1.5][(rnd()*5)|0];
        mi = Math.max(0, Math.min(penta.length - 1, mi + Math.round((rnd() - 0.5) * 4)));
        if (rnd() > 0.15) add(t0 + tt*bt, d*bt*0.95, 2, penta[mi], 85 + (rnd()*30|0));
        tt += d;
      }
    }
    if (bar >= 16 && bar < 24 && bar % 2 === 0) ch.forEach((n, i) => add(t0 + i*bt*0.5, bt*0.4, 4, n + 24, 70));
  }
  const tEnd = bars * 4 * bt;
  [45, 57, 60, 64, 69, 76].forEach(n => add(tEnd, 4*bt, n < 50 ? 1 : 3, n, 70));
  const beats = []; for (let i = 0; i <= bars*4 + 4; i++) beats.push(i * bt);
  return buildSong(ev, beats, 'Lumina Demo — Nocturne in A minor', 4);
}

/* ============================== built-in synth ============================== */
const Synth = {
  ac: null,
  init() {
    if (this.ac) { this.ac.resume(); return; }
    const ac = this.ac = new (window.AudioContext || window.webkitAudioContext)();
    this.out = ac.createGain(); this.out.gain.value = 0.7;
    const comp = ac.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 4;
    this.out.connect(comp); comp.connect(ac.destination);
    const len = ac.sampleRate * 2.4 | 0, ir = ac.createBuffer(2, len, ac.sampleRate);
    for (let c = 0; c < 2; c++) { const dd = ir.getChannelData(c); for (let i = 0; i < len; i++) dd[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 3.2); }
    const conv = ac.createConvolver(); conv.buffer = ir;
    this.rev = ac.createGain(); this.rev.gain.value = 0.25; this.rev.connect(conv); conv.connect(comp);
    const nb = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const nd = nb.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random()*2 - 1;
    this.noise = nb; this.voices = new Map(); this.prog = new Array(16).fill(0); this.vol = new Array(16).fill(1);
  },
  time(ts) { return this.ac.currentTime + Math.max(0, (ts - performance.now()) / 1000) + 0.02; },
  msg(d, ts) {
    if (!this.ac) return;
    const st = d[0] & 0xF0, ch = d[0] & 15, t = this.time(ts);
    if (st === 0x90 && d[2] > 0) this.noteOn(ch, d[1], d[2], t);
    else if (st === 0x80 || st === 0x90) this.release(ch*128 + d[1], t);
    else if (st === 0xC0) this.prog[ch] = d[1];
    else if (st === 0xB0 && d[1] === 7) this.vol[ch] = d[2] / 127;
    else if (st === 0xB0 && (d[1] === 123 || d[1] === 120)) this.allOff();
  },
  noteOn(ch, n, v, t) {
    const ac = this.ac, key = ch*128 + n; this.release(key, t, 0.03);
    const amp = Math.pow(v/127, 1.6) * 0.16 * this.vol[ch];
    if (ch === 9) return this.drum(n, amp, t);
    const fam = this.prog[ch] >> 3, f = 440 * Math.pow(2, (n - 69) / 12);
    const WAVES = ['triangle','sine','square','triangle','triangle','sawtooth','sawtooth','sawtooth','square','sine','sawtooth','sawtooth','triangle','triangle','square','sine'];
    const perc = [0,1,3,4,13,14].includes(fam);
    const g = ac.createGain(), flt = ac.createBiquadFilter();
    flt.type = 'lowpass'; flt.Q.value = 0.8;
    flt.frequency.setValueAtTime(Math.min(16000, f * (perc ? 8 : 5) + 800), t);
    if (perc) flt.frequency.setTargetAtTime(Math.min(16000, f * 2 + 300), t, 0.3);
    const oscs = [];
    for (const det of [-6, 6]) {
      const o = ac.createOscillator(); o.type = WAVES[fam]; o.frequency.value = f; o.detune.value = det;
      o.connect(flt); o.start(t); oscs.push(o);
    }
    flt.connect(g); g.connect(this.out); g.connect(this.rev);
    const att = [5,6,11].includes(fam) ? 0.09 : 0.005;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(amp, t + att);
    if (perc) g.gain.setTargetAtTime(0, t + att, 0.25 + Math.max(0, 84 - n) * 0.025);
    else g.gain.setTargetAtTime(amp * 0.7, t + att, 0.15);
    this.voices.set(key, {oscs, g});
  },
  drum(n, amp, t) {
    const ac = this.ac, g = ac.createGain(); g.connect(this.out); g.connect(this.rev);
    if (n === 35 || n === 36) {
      const o = ac.createOscillator(); o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.14);
      g.gain.setValueAtTime(amp * 3, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
      o.connect(g); o.start(t); o.stop(t + 0.45); return;
    }
    const src = ac.createBufferSource(); src.buffer = this.noise; const f = ac.createBiquadFilter();
    let dec = 0.1, a = amp * 1.6;

      const rad = big * 1.4 * ease * k;
      ctx.strokeStyle = `rgba(${rgb},${(1 - u) * 0.75 * fog})`; ctx.lineWidth = 1 + 2.5 * (1 - u);
      ctx.beginPath(); ctx.ellipse(P.x, P.y, rad, rad * this.st, 0, 0, TAU); ctx.stroke();
    }
    const M = kind === 4 ? 18 : kind === 0 ? 10 : kind === 1 ? 14 : 8, ds = Math.max(1.5, k * 0.009 * (1 - u * 0.5));
    ctx.fillStyle = `rgba(${rgb},${(1 - u) * fog})`;

      const a = i / M * TAU + n.note, hs = big * (0.5 + 0.8 * ((i * 0.618) % 1)) * ease, vz = 0.35 + 0.3 * ((i * 0.37) % 1), zh = 0.03 + vz * age - 0.9 * age * age;
      if (zh < 0) continue;

  },
  draw(t, dt) {

    this.cam += ((c ? sx / c * 0.7 : 0) - this.cam) * Math.min(1, dt * 1.6);
    this.setCam(yn);
    const fog = wy => { const a = wy - yn; return a <= 0 ? 1 : Math.pow(Math.max(0, 1 - a / LY), 1.1); };

    ctx.globalCompositeOperation = 'source-over';
    const bg = ctx.createRadialGradient(W2, H * 0.55, 0, W2, H * 0.55, Math.max(W, H) * 0.8);
    bg.addColorStop(0, '#0a1020'); bg.addColorStop(1, '#02030a'); ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    for (const q of this.stars) { ctx.fillStyle = `rgba(210,220,255,${0.12 + 0.14 * Math.sin(t * 1.5 + q.p)})`; ctx.fillRect(q.x * W, q.y * H, q.s, q.s); }
    const T = this.LOOK + this.BACK, RL = 0.5 * W / this.S0 * 0.9;   // ground dust, fixed in the world
    for (const d of this.dust) {
      const wy = yn + ((((d.t0 - t) % T) + T) % T - this.BACK) * SPD; if (!this.pr(d.x * RL, wy)) continue;
      ctx.fillStyle = (d.c ? 'rgba(255,214,120,' : 'rgba(200,220,255,') + (fog(wy) * 0.5) + ')';
      const q = Math.max(1, P.k * 0.005); ctx.fillRect(P.x, P.y, q, q);
    }
    const B = s.beats;                                           // beat rows (world-fixed) + small tick squares just outside the pitch range
    for (let i = lb(B, t - this.BACK, x => x); i < B.length && B[i] < tmax; i++) {
      const wy = B[i] * SPD; if (!this.pr(this.cam, wy)) continue; const y = P.y; if (y < -10 || y > H + 10) continue;
      const down = i % s.bpb === 0, f = fog(wy);
      ctx.fillStyle = `rgba(170,180,255,${f * (down ? 0.09 : 0.035)})`; ctx.fillRect(0, y, W, 1);
      ctx.fillStyle = `rgba(235,240,255,${f * (down ? 0.7 : 0.35)})`;
      for (const sg of [-1, 1]) if (this.pr(sg * 0.97, wy)) { const q = (down ? 0.02 : 0.012) * P.k; ctx.fillRect(P.x - q/2, P.y - q/2, q, q); }
    }

    // growing arc threads
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const edges = this.tree.edges, SPAN = TRAIL_BREAK + 2 * TRAIL_STEP + 0.05; let drawn = 0;
    for (let i = lb(edges, t - this.BACK, e => e.tb); i < edges.length && edges[i].tb - SPAN <= t && drawn < 2500; i++) {
      const e = edges[i]; if (e.ta > t) continue;
      const f = Math.min(1, (t - e.ta) / (e.tb - e.ta)), poly = e.poly || (e.poly = trailPoly(e.arcs));
      const target = f * poly.L, PT = poly.pts, Cu = poly.cum, nP = Cu.length;
      let started = false, hx = 0, hy = 0, lk = 1;
      ctx.beginPath();

        let px = PT[2*k], py = PT[2*k+1], last = false;
        if (k > 0 && Cu[k] > target) { const u = (target - Cu[k-1]) / (Cu[k] - Cu[k-1]); px = PT[2*k-2] + (px - PT[2*k-2]) * u; py = PT[2*k-1] + (py - PT[2*k-1]) * u; last = true; }
        if (!this.pr(px, py)) started = false;
        else { started ? ctx.lineTo(P.x, P.y) : ctx.moveTo(P.x, P.y); started = true; hx = P.x; hy = P.y; lk = P.k; }
        if (last) break;
      }
      drawn++;
      const a = 0.55 + 0.45 * e.v / 127, lw = Math.max(1.2, Math.min(7, 0.0055 * lk));
      ctx.strokeStyle = `rgba(${PAL[e.ch]},${a * 0.14})`; ctx.lineWidth = lw * 4.5; ctx.stroke();
      ctx.strokeStyle = `rgba(${PAL[e.ch]},${a})`; ctx.lineWidth = lw; ctx.stroke();
      if (f < 1) { ctx.strokeStyle = `rgba(255,255,255,${a * 0.5})`; ctx.lineWidth = lw * 0.4; ctx.stroke(); if (started) glow(e.ch, hx, hy, 26 + lw * 4, 0.9); }
    }
    ctx.lineWidth = 1;

    // pass 1: note blocks that have not been played yet (solid)
    const i0 = lb(N, t - this.BACK, x => x.start); let cnt = 0;
    ctx.globalCompositeOperation = 'source-over';
    for (let i = i0; i < N.length && N[i].start < tmax && cnt < 2200; i++) {
      const n = N[i]; if (n.start <= t) continue;
      const wy = n.start * SPD, f = fog(wy), v = n.vel / 127;
      if (n.ch === 9) { const k = drumKind(n.note); if (this.block(drumWX(n.note), wy, 0.04 + 0.025 * v, DRUM_RGB[k], f)) cnt++; }
      else if (this.block(n.wx, wy, 0.026 + 0.014 * v, PALN[n.ch], f)) cnt++;
    }
    // pass 2: glow on blocks about to fire, then firework / percussion bursts
    ctx.globalCompositeOperation = 'lighter'; let nb = 0;
    for (let i = i0; i < N.length && N[i].start < tmax && nb < 160; i++) {
      const n = N[i], age = t - n.start, wy = n.start * SPD, f = fog(wy), drum = n.ch === 9;
      const wx = drum ? drumWX(n.note) : n.wx;
      if (age < 0) {
        if (!this.pr(wx, wy, 0.015)) continue;
        const arm = Math.max(0, 1 - (n.start - t) / 0.3);
        glow(drum ? DRUM_GLOW[drumKind(n.note)] : n.ch, P.x, P.y, P.k * 0.1, f * (0.28 + 0.6 * arm));
      } else { nb++; if (drum) this.drumBurst(n, wx, wy, age, 1); else { this.burst(n, age, 1); if (n.end > t && this.pr(wx, wy)) glow(n.ch, P.x, P.y, P.k * 0.05, 0.5); } }
    }
    ctx.lineWidth = 1;
  }
};

/* ============================== engine ============================== */
const MODES = [Cascade, Orbit, Warp, Trail];
let mode = 0;
MODES.forEach(m => m.init && m.init());
function setMode(m) {
  mode = m; parts.length = 0;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', +b.dataset.m === m));
  ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = '#04050b'; ctx.fillRect(0,0,W,H);
  $('#hint').textContent = MODES[m].hint;
}
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  MODES.forEach(m => m.layout && m.layout()); drawMini();
  ctx.fillStyle = '#04050b'; ctx.fillRect(0,0,W,H);
}
function drawMini() {
  const c = $('#mini'), r = c.getBoundingClientRect(); c.width = r.width*DPR; c.height = r.height*DPR;
  const g = c.getContext('2d'); g.setTransform(DPR,0,0,DPR,0,0); g.clearRect(0,0,r.width,r.height);
  if (!song) return;
  const s = song, span = s.hi - s.lo + 1, w = r.width, h = r.height; g.globalCompositeOperation = 'lighter';
  for (const n of s.notes) { g.fillStyle = `rgba(${PAL[n.ch]},0.55)`; g.fillRect(n.start/s.dur*w, (1 - (n.note - s.lo + 1)/span)*h, Math.max(1, (n.end - n.start)/s.dur*w), Math.max(1, h/span)); }
}

let lastFrame = performance.now(), lastTimeTxt = '';
function frame(now) {
  const dt = Math.min(0.05, (now - lastFrame)/1000); lastFrame = now;
  const t = song ? songTime() : now/1000;
  if (song) {
    if (t < V.lastT - 0.001 || t - V.lastT > 1) resync(t);
    const N = song.notes;
    while (V.idx < N.length && N[V.idx].start <= t) {
      const n = N[V.idx++];
      if (n.end > t) { V.active.push(n); V.energy += n.vel/127*0.09; MODES[mode].hit(n); }
    }
    V.active = V.active.filter(n => n.end > t); V.lastT = t;
  }
  V.energy *= Math.exp(-dt*1.6);
  MODES[mode].draw(t, dt);
  if (song) {
    const f = Math.min(1, t / song.dur); $('#ph').style.left = (f*100) + '%'; $('#shade').style.width = (f*100) + '%';
    const txt = fmt(t) + ' / ' + fmt(song.dur); if (txt !== lastTimeTxt) { $('#time').textContent = txt; lastTimeTxt = txt; }
  }
  requestAnimationFrame(frame);
}

/* ============================== loading & UI ============================== */
function loadSong(s, label) {
  stop(); song = s; P.pos = 0;
  MODES.forEach(m => m.layout && m.layout()); resync(0); drawMini(); setMode(mode);
  $('#title').textContent = label; $('#drop').classList.add('hide');
  toast(`${s.notes.length.toLocaleString()} notes · ${s.chans.size} channels · ${fmt(s.dur)}`);
  play();
}
async function loadFile(f) {
  try { const s = parseMIDI(await f.arrayBuffer()); loadSong(s, s.name ? `${s.name} — ${f.name}` : f.name); }
  catch (e) { console.error(e); toast('⚠ ' + e.message); }
}
$('#file').onchange = e => { if (e.target.files[0]) loadFile(e.target.files[0]); e.target.value = ''; };
$('#demo').onclick = () => loadSong(demoSong(), 'Lumina Demo — Nocturne in A minor');
$('#play').onclick = () => P.playing ? pause() : play();
$('#stop').onclick = stop;
$('#loop').onclick = () => { P.loop = !P.loop; updBtns(); };
$('#speed').onchange = e => { const t = songTime(), was = P.playing; if (was) { P.playing = false; silence(); } P.pos = t; P.speed = +e.target.value; if (was) play(); };
$('#out').onchange = e => setOutput(e.target.value);
$('#fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => setMode(+b.dataset.m));

const mw = $('#miniWrap'); let dragging = false;
const seekFromEvt = e => { const r = mw.getBoundingClientRect(); seek((e.clientX - r.left)/r.width * (song ? song.dur : 0)); };
mw.addEventListener('pointerdown', e => { dragging = true; mw.setPointerCapture(e.pointerId); seekFromEvt(e); });
mw.addEventListener('pointermove', e => { if (dragging) seekFromEvt(e); });
mw.addEventListener('pointerup', () => dragging = false);

addEventListener('wheel', e => { if (mode === 0) Cascade.vis = Math.max(0.8, Math.min(12, Cascade.vis * (e.deltaY > 0 ? 1.1 : 0.9))); else if (mode === 3) Trail.tilt = Math.max(0.6, Math.min(1.5, Trail.tilt + (e.deltaY > 0 ? 0.04 : -0.04))); }, {passive:true});
addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); P.playing ? pause() : play(); }
  else if (e.key >= '1' && e.key <= '4') setMode(+e.key - 1);
  else if (e.key === 'ArrowRight') seek(songTime() + 5);
  else if (e.key === 'ArrowLeft') seek(songTime() - 5);
  else if (e.key.toLowerCase() === 'f') $('#fs').click();
});
const drop = $('#drop');
addEventListener('dragover', e => { e.preventDefault(); drop.classList.remove('hide'); drop.classList.add('drag'); });
addEventListener('dragleave', e => { if (!e.relatedTarget) { drop.classList.remove('drag'); if (song) drop.classList.add('hide'); } });
addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('drag'); const f = e.dataTransfer.files[0]; if (f) loadFile(f); else if (song) drop.classList.add('hide'); });

let idleT; const wake = () => { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => { if (P.playing) document.body.classList.add('idle'); }, 2800); };
addEventListener('pointermove', wake); addEventListener('keydown', wake);

addEventListener('resize', resize);
resize(); setMode(0); updBtns(); initMIDI();
requestAnimationFrame(frame);
</script>
