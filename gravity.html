<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>二维卫星轨道模拟器</title>
  <style>
*{box-sizing:border-box;touch-action:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070d;color:#e8edf7;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#wrap{position:relative;width:100%;height:100%}
canvas{display:block;width:100%;height:100%;cursor:grab}
canvas:active{cursor:grabbing}

/* ---------- Floating Toolbar (fft-epicycles style) ---------- */
.toolbar{
  position:fixed;bottom:18px;right:18px;
  display:flex;flex-direction:column;align-items:flex-end;gap:10px;
  z-index:1000;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  transition:opacity .25s;
}
.toolbar-main{
  display:flex;flex-direction:row;
  background:rgba(12,16,28,.82);
  border:1px solid rgba(255,255,255,.14);
  border-radius:30px;padding:5px;gap:5px;
  box-shadow:0 8px 32px rgba(0,0,0,.4);
  transition:all .3s cubic-bezier(.4,0,.2,1);
}
.toolbar.collapsed .toolbar-main{overflow:hidden;padding:5px;}
.icon-btn{
  width:40px;height:40px;min-width:40px;min-height:40px;
  display:flex;align-items:center;justify-content:center;
  background:transparent;border:none;border-radius:50%;
  cursor:pointer;font-size:20px;color:#e8edf7;
  transition:background .2s,transform .1s;
  position:relative;
}
.icon-btn:hover{background:rgba(255,255,255,.1)}
.icon-btn:active{transform:scale(.9)}
.icon-btn.active{background:rgba(112,150,209,.4);box-shadow:0 0 8px rgba(112,150,209,.55)}

/* Pop-up panels */
.popover{
  position:absolute;bottom:58px;right:0;
  background:rgba(12,16,28,.92);
  border:1px solid rgba(255,255,255,.1);
  border-radius:12px;padding:12px;
  display:none;flex-direction:column;gap:8px;
  min-width:200px;max-width:280px;max-height:60vh;overflow-y:auto;
  box-shadow:0 5px 15px rgba(0,0,0,.5);
  z-index:1100;
}
.popover.active{display:flex}
.popover .label{font-size:12px;color:#94a0b8;margin-bottom:2px}
.popover .val-text{color:#a5c2f5;font-weight:600;font-size:12px}

.popover input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;background:transparent;margin:8px 0;cursor:pointer;
}
.popover input[type=range]::-webkit-slider-runnable-track{
  width:100%;height:4px;background:rgba(255,255,255,.1);border-radius:2px;
}
.popover input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#7096d1;
  margin-top:-5px;border:2px solid #a5c2f5;cursor:pointer;
}
.popover input[type=range]::-moz-range-track{width:100%;height:4px;background:rgba(255,255,255,.1);border-radius:2px}
.popover input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#7096d1;border:2px solid #a5c2f5;cursor:pointer}

.popover .action-btn{
  width:100%;border:none;border-radius:8px;padding:9px;cursor:pointer;
  font-weight:600;font-size:12px;transition:all .2s;
  background:#2b3a55;color:#fff;
}
.popover .action-btn:hover{background:#3d5075}
.popover .action-btn.highlight{background:#2e7d32;color:#fff}
.popover .action-btn.highlight:hover{background:#388e3c}

.hidden-on-collapse{display:flex;flex-direction:row;gap:5px;max-height:60vh;overflow-y:auto}
.toolbar.collapsed .hidden-on-collapse{display:none}

/* Physics info panel (subtle) */
#physicsPanel{
  position:absolute;left:16px;top:16px;width:250px;padding:12px 14px;
  background:rgba(8,12,22,.55);border:1px solid rgba(255,255,255,.08);
  border-radius:12px;backdrop-filter:blur(6px);
  box-shadow:0 4px 20px rgba(0,0,0,.25);
  font-size:12px;line-height:1.5;user-select:none;
  transition:opacity .25s,background .25s,pointer-events .25s;
}
#physicsPanel.faded{
  opacity:.35;background:rgba(8,12,22,.25);pointer-events:none;
}
#physicsPanel h1{font-size:14px;margin:0 0 6px;color:#a5c2f5;font-weight:600}
#physicsPanel .grid{display:grid;grid-template-columns:1fr auto;gap:2px 10px}
#physicsPanel .label{color:#94a0b8}
#physicsPanel .value{font-variant-numeric:tabular-nums;text-align:right;font-weight:500}
#physicsPanel .sep{height:1px;background:rgba(255,255,255,.08);margin:8px 0}

#help{position:absolute;right:16px;bottom:78px;padding:8px 12px;border-radius:9px;
  background:rgba(8,12,22,.75);color:#aeb8cb;font-size:11px;border:1px solid rgba(255,255,255,.08);pointer-events:none}

@media (max-width:600px){
  .toolbar-main{flex-direction:column;border-radius:25px}
  .hidden-on-collapse{flex-direction:column;border-bottom:1px solid rgba(255,255,255,.12)}
  .popover{bottom:15px;right:58px;max-width:calc(100vw - 90px)}
  #physicsPanel{width:calc(100% - 32px);max-width:280px}
  #help{bottom:88px}
}
</style>
</head>
<body>
<div id="wrap">
<canvas id="canvas"></canvas>

<!-- Subtle physics info panel -->
<div id="physicsPanel">
  <h1>二维卫星轨道模拟器</h1>
  <div class="grid">
   <span class="label">模拟时间</span><span class="value" id="time">0.00 s</span>
   <span class="label">当前距离</span><span class="value" id="radius">—</span>
   <span class="label">当前速度</span><span class="value" id="speed">—</span>
   <span class="label">环绕速度</span><span class="value" id="circSpeed" style="color:#96dcff">—</span>
   <span class="label">逃逸速度</span><span class="value" id="escSpeed" style="color:#ff6b6b">—</span>
   <span class="label">缩放比例</span><span class="value" id="scaleDisplay">100%</span>
  </div>
  <div class="sep"></div>
  <div class="grid">
   <span class="label">近点 Periapsis</span><span class="value" id="peri" style="color:#ffbe64">—</span>
   <span class="label">远点 Apoapsis</span><span class="value" id="apo" style="color:#96dcff">—</span>
   <span class="label">半长轴</span><span class="value" id="semi">—</span>
   <span class="label">偏心率</span><span class="value" id="ecc">—</span>
   <span class="label">轨道周期</span><span class="value" id="period">—</span>
   <span class="label">轨道类型</span><span class="value" id="type">—</span>
  </div>
</div>

<!-- Floating toolbar -->
<div class="toolbar" id="mainToolbar">
  <div class="toolbar-main">
    <div class="hidden-on-collapse">
      <!-- Physics info toggle -->
      <button class="icon-btn" id="physicsToggleBtn" title="切换物理信息穿透">📊</button>

      <!-- Time controls -->
      <button class="icon-btn" id="timeBtn" title="时间控制">⏱️</button>
      <div class="popover" id="timePopover">
        <span class="label">时间速率 <span id="speedFactorDisplay" class="val-text">1.00×</span></span>
        <input type="range" id="speedSlider" min="-100" max="100" value="0" step="1">
        <div style="display:flex;justify-content:space-between;font-size:10px;color:#94a0b8"><span>0.001×</span><span>1×</span><span>1000×</span></div>
      </div>

      <!-- View controls -->
      <button class="icon-btn" id="viewBtn" title="视图选项">👁️</button>
      <div class="popover" id="viewPopover">
        <span class="label">视图</span>
        <button class="action-btn" id="btnView">视图: 中心视角</button>
        <button class="action-btn" id="btnResetZoom">重置缩放/视角</button>
      </div>

      <!-- Orbit tools -->
      <button class="icon-btn" id="orbitBtn" title="轨道工具">🪐</button>
      <div class="popover" id="orbitPopover">
        <span class="label">轨道工具</span>
        <button class="action-btn highlight" id="btnCircle">一键轨道圆化</button>
        <button class="action-btn" id="btnZeroVelocity">速度归零</button>
      </div>

      <!-- Reset -->
      <button class="icon-btn" id="resetBtn" title="重置卫星 (R)">🔄</button>
    </div>

    <!-- Toggle -->
    <button class="icon-btn" id="toggleBar" title="折叠工具栏">🛠️</button>
  </div>
</div>

<div id="help">拖拽卫星周围: 任意方向加减速 | 拖拽空白处: 平移视角 | 滚轮/双指: 缩放</div>
</div>

<script>
"use strict";

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const ui = {
  time: document.getElementById("time"),
  radius: document.getElementById("radius"),
  speed: document.getElementById("speed"),
  circSpeed: document.getElementById("circSpeed"),
  escSpeed: document.getElementById("escSpeed"),
  scaleDisplay: document.getElementById("scaleDisplay"),
  peri: document.getElementById("peri"),
  apo: document.getElementById("apo"),
  semi: document.getElementById("semi"),
  ecc: document.getElementById("ecc"),
  period: document.getElementById("period"),
  type: document.getElementById("type"),
  btnView: document.getElementById("btnView"),
  btnCircle: document.getElementById("btnCircle"),
  speedSlider: document.getElementById("speedSlider"),
  speedFactorDisplay: document.getElementById("speedFactorDisplay"),
  physicsPanel: document.getElementById("physicsPanel"),
  physicsToggleBtn: document.getElementById("physicsToggleBtn")
};

const GM = 18000;
const FIXED_DT = 1 / 120;
const MAX_FRAME_DT = 0.10;
const MAX_SUBSTEPS = 24;
const MAX_SUBSTEPS_HARD = 5000; // 高倍速时允许的最大子步数
const IMPULSE_SCALE = 0.03; // 矢量拉拽增益比例

let dpr = 1;
let cssW = 0, cssH = 0;
let timeSpeed = 1.0; // 时间加速倍率

// 视图与相机状态
let zoom = 1.0;
let panWorld = { x: 0, y: 0 };
let viewMode = "center"; // "center" 或 "sat"

const initial = {
  x: 240,
  y: 0,
  vx: 0,
  vy: Math.sqrt(GM / 240) * 0.75
};

const sat = {...initial};
let simTime = 0;
let accumulator = 0;
let lastTimestamp = null;
let lastRealDt = 0;
let trail = [];
const MAX_TRAIL = 1500;

// 交互状态
let interactionType = null; // "thrust" (推力) 或 "pan" (平移视角)
let dragCurrent = { x: 0, y: 0 };
let impulseMarker = null;

function resize() {
  dpr = window.devicePixelRatio || 1;
  cssW = canvas.clientWidth;
  cssH = canvas.clientHeight;
  canvas.width = Math.max(1, Math.round(cssW * dpr));
  canvas.height = Math.max(1, Math.round(cssH * dpr));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

function getCameraWorld() {
  if (viewMode === "sat") {
    return { x: sat.x, y: sat.y };
  }
  return panWorld;
}

function worldToScreen(x, y) {
  const cam = getCameraWorld();
  return {
    x: cssW / 2 + (x - cam.x) * zoom,
    y: cssH / 2 + (y - cam.y) * zoom
  };
}

// ---------- 物理引擎 ----------
function step(dt) {
  let r2 = sat.x*sat.x + sat.y*sat.y;
  let r = Math.sqrt(r2);

  if (r < 12) {
    const scale = 12 / Math.max(r, 1e-6);
    sat.x *= scale;
    sat.y *= scale;
    r2 = 144;
    r = 12;
  }

  const invR3 = 1 / (r2 * r);
  const ax1 = -GM * sat.x * invR3;
  const ay1 = -GM * sat.y * invR3;

  sat.vx += ax1 * dt * 0.5;
  sat.vy += ay1 * dt * 0.5;

  sat.x += sat.vx * dt;
  sat.y += sat.vy * dt;

  const r2_new = sat.x*sat.x + sat.y*sat.y;
  const r_new = Math.sqrt(r2_new);
  const invR3_new = 1 / (r2_new * r_new);

  const ax2 = -GM * sat.x * invR3_new;
  const ay2 = -GM * sat.y * invR3_new;

  sat.vx += ax2 * dt * 0.5;
  sat.vy += ay2 * dt * 0.5;

  simTime += dt;

  if (trail.length === 0 || Math.hypot(sat.x - trail[trail.length-1].x, sat.y - trail[trail.length-1].y) > 2) {
    trail.push({x: sat.x, y: sat.y});
    if (trail.length > MAX_TRAIL) trail.shift();
  }
}

// ---------- 直觉触摸与手势逻辑 ----------
let activePointers = new Map();
let lastPointerPos = { x: 0, y: 0 };
let initialPinchDist = null;
let initialZoom = 1.0;

canvas.addEventListener("pointerdown", e => {
  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (activePointers.size === 1) {
    const sSat = worldToScreen(sat.x, sat.y);
    const distToSat = Math.hypot(e.clientX - sSat.x, e.clientY - sSat.y);

    // 核心逻辑：若点击在卫星附近（50像素内，考虑防误触与手机大指腹）
    if (distToSat < 50) {
      interactionType = "thrust";
      dragCurrent = { x: e.clientX, y: e.clientY };
    } else {
      interactionType = "pan";
      lastPointerPos = { x: e.clientX, y: e.clientY };
    }
  } else if (activePointers.size === 2) {
    // 双指捏合缩放，取消推力拖拽
    interactionType = null;
    const pts = Array.from(activePointers.values());
    initialPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    initialZoom = zoom;
  }
});

canvas.addEventListener("pointermove", e => {
  if (!activePointers.has(e.pointerId)) return;
  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (activePointers.size === 2 && initialPinchDist) {
    const pts = Array.from(activePointers.values());
    const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    const factor = dist / initialPinchDist;
    zoom = Math.min(Math.max(initialZoom * factor, 0.15), 10.0);
  } else if (activePointers.size === 1) {
    if (interactionType === "thrust") {
      dragCurrent = { x: e.clientX, y: e.clientY };
    } else if (interactionType === "pan") {
      const dx = (e.clientX - lastPointerPos.x) / zoom;
      const dy = (e.clientY - lastPointerPos.y) / zoom;
      panWorld.x -= dx;
      panWorld.y -= dy;
      lastPointerPos = { x: e.clientX, y: e.clientY };
    }
  }
});

function endPointer(e) {
  activePointers.delete(e.pointerId);

  if (interactionType === "thrust" && activePointers.size === 0) {
    const sSat = worldToScreen(sat.x, sat.y);
    // 正向矢量：指向鼠标/手指的位置 (从卫星指向当前拖拽点)
    const dx = dragCurrent.x - sSat.x;
    const dy = dragCurrent.y - sSat.y;

    const dvx = dx * IMPULSE_SCALE;
    const dvy = dy * IMPULSE_SCALE;

    if (Math.hypot(dvx, dvy) > 0.05) {
      sat.vx += dvx;
      sat.vy += dvy;

      impulseMarker = {
        vx: dvx,
        vy: dvy,
        mag: Math.hypot(dvx, dvy),
        timer: 2.0
      };
    }
  }

  if (activePointers.size === 0) {
    interactionType = null;
  }
  if (activePointers.size < 2) initialPinchDist = null;
}
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);

// 鼠标滚轮缩放
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  const zoomFactor = e.deltaY < 0 ? 1.12 : 0.88;
  zoom = Math.min(Math.max(zoom * zoomFactor, 0.15), 10.0);
}, { passive: false });

// ---------- UI 按钮 ----------
function setViewMode(mode) {
  viewMode = mode;
  if (viewMode === "sat") {
    ui.btnView.textContent = "视图: 卫星中心";
    ui.btnView.classList.add("active");
  } else {
    ui.btnView.textContent = "视图: 中心视角";
    ui.btnView.classList.remove("active");
  }
}

ui.btnView.addEventListener("click", () => {
  setViewMode(viewMode === "center" ? "sat" : "center");
});

document.getElementById("btnResetZoom").addEventListener("click", () => {
  zoom = 1.0;
  panWorld = { x: 0, y: 0 };
});

// 一键轨道圆化（自动计算最佳方向与大小）
ui.btnCircle.addEventListener("click", () => {
  const r = Math.hypot(sat.x, sat.y);
  if (r < 1e-3) return;

  const vCircScalar = Math.sqrt(GM / r);

  // 径向单位向量 r̂ = (x/r, y/r)
  // 切向方向（垂直于径向）有两个：顺时针和逆时针
  // 逆时针切向: (-y/r, x/r)
  // 顺时针切向: (y/r, -x/r)
  const rx = sat.x / r;
  const ry = sat.y / r;

  // 两个可能的切向方向
  const t1x = -ry;  // 逆时针
  const t1y = rx;
  const t2x = ry;   // 顺时针
  const t2y = -rx;

  // 选择与当前速度方向更一致的那个 (点积更大的)
  const dot1 = sat.vx * t1x + sat.vy * t1y;
  const dot2 = sat.vx * t2x + sat.vy * t2y;

  let targetVx, targetVy;
  if (dot1 >= dot2) {
    targetVx = t1x * vCircScalar;
    targetVy = t1y * vCircScalar;
  } else {
    targetVx = t2x * vCircScalar;
    targetVy = t2y * vCircScalar;
  }

  const dvx = targetVx - sat.vx;
  const dvy = targetVy - sat.vy;

  sat.vx = targetVx;
  sat.vy = targetVy;

  impulseMarker = {
    vx: dvx,
    vy: dvy,
    mag: Math.hypot(dvx, dvy),
    timer: 2.0
  };
});

// 速度归零
document.getElementById("btnZeroVelocity").addEventListener("click", () => {
  sat.vx = 0;
  sat.vy = 0;
  impulseMarker = null;
});

function reset() {
  Object.assign(sat, initial);
  simTime = 0;
  accumulator = 0;
  trail = [];
  trail.push({x: sat.x, y: sat.y});
  impulseMarker = null;
  panWorld = { x: 0, y: 0 };
}
document.getElementById("resetBtn").addEventListener("click", reset);
window.addEventListener("keydown", e => {
  if (e.key.toLowerCase() === "r") reset();
});

// ---------- 时间倍率滑块 ----------
// 对数映射: sliderValue (-100~100) → factor (0.001~1000)
// factor = 1000^(sliderValue / 100)
function sliderToSpeed(val) {
  return Math.pow(1000, val / 100);
}

function speedToSlider(factor) {
  // 反函数: val = 100 * log_1000(factor) = 100 * ln(factor) / ln(1000)
  return Math.round(100 * Math.log(factor) / Math.log(1000));
}

function updateSpeedDisplay() {
  const factor = sliderToSpeed(parseInt(ui.speedSlider.value));
  timeSpeed = factor;
  if (factor < 0.01) {
    ui.speedFactorDisplay.textContent = factor.toExponential(2) + "×";
  } else if (factor < 1) {
    ui.speedFactorDisplay.textContent = factor.toFixed(4) + "×";
  } else if (factor < 10) {
    ui.speedFactorDisplay.textContent = factor.toFixed(2) + "×";
  } else if (factor < 100) {
    ui.speedFactorDisplay.textContent = factor.toFixed(1) + "×";
  } else if (factor < 10000) {
    ui.speedFactorDisplay.textContent = Math.round(factor) + "×";
  } else {
    ui.speedFactorDisplay.textContent = factor.toExponential(2) + "×";
  }
}

ui.speedSlider.addEventListener("input", updateSpeedDisplay);
updateSpeedDisplay();

// ---------- 工具栏交互 ----------
(function setupToolbar() {
  const toolbar = document.getElementById("mainToolbar");
  document.getElementById("toggleBar").addEventListener("click", () => {
    toolbar.classList.toggle("collapsed");
  });

  // 物理信息面板穿透切换
  let physicsFaded = false;
  ui.physicsToggleBtn.addEventListener("click", () => {
    physicsFaded = !physicsFaded;
    ui.physicsPanel.classList.toggle("faded", physicsFaded);
    ui.physicsToggleBtn.classList.toggle("active", physicsFaded);
  });

  // Popover 切换逻辑
  const buttons = ["timeBtn", "viewBtn", "orbitBtn"];
  const popovers = ["timePopover", "viewPopover", "orbitPopover"];

  buttons.forEach((id, i) => {
    document.getElementById(id).addEventListener("click", (e) => {
      const pop = document.getElementById(popovers[i]);
      const isActive = pop.classList.contains("active");
      popovers.forEach(p => document.getElementById(p).classList.remove("active"));
      if (!isActive) pop.classList.add("active");
      e.stopPropagation();
    });
  });

  document.addEventListener("click", (e) => {
    if (!e.target.closest(".popover") && !e.target.closest(".icon-btn")) {
      popovers.forEach(p => document.getElementById(p).classList.remove("active"));
    }
  });
})();

// ---------- 轨道计算与绘制 ----------
function getOrbitalElements(targetSat = sat) {
  const x = targetSat.x, y = targetSat.y, vx = targetSat.vx, vy = targetSat.vy;
  const r = Math.hypot(x, y);
  const v2 = vx*vx + vy*vy;
  const v = Math.sqrt(v2);

  const energy = v2 / 2 - GM / r;
  const rv = x * vx + y * vy;
  const h = x * vy - y * vx;
  const p = h * h / GM;
  const ex = ((v2 - GM/r) * x - rv * vx) / GM;
  const ey = ((v2 - GM/r) * y - rv * vy) / GM;
  const e = Math.hypot(ex, ey);

  let a = Infinity;
  if (Math.abs(energy) > 1e-9) a = -GM / (2 * energy);

  const peri = a * (1 - e);
  const apo = (e < 1 && a > 0) ? a * (1 + e) : Infinity;

  let period = Infinity;
  if (a > 0 && e < 1) period = 2 * Math.PI * Math.sqrt(Math.pow(a, 3) / GM);

  let type = "双曲线";
  if (Math.abs(e - 1) < 1e-3) type = "抛物线";
  else if (e < 1) type = "椭圆";

  return {r, v, energy, e, a, peri: Math.abs(peri), apo, period, type, ex, ey, p};
}

function drawOrbit(el, strokeStyle = "rgba(130, 190, 255, 0.65)") {
  const omega = Math.atan2(el.ey, el.ex);
  const points = 360;

  if (el.e < 1 && el.a > 0) {
    // 椭圆轨道
    ctx.save();
    ctx.beginPath();

    for (let i = 0; i <= points; i++) {
      const nu = (2 * Math.PI * i) / points;
      const rr = el.p / (1 + el.e * Math.cos(nu));
      const theta = nu + omega;
      const s = worldToScreen(rr * Math.cos(theta), rr * Math.sin(theta));

      if (i === 0) ctx.moveTo(s.x, s.y);
      else ctx.lineTo(s.x, s.y);
    }

    ctx.setLineDash([5, 5]);
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = strokeStyle;
    ctx.stroke();
    ctx.restore();

    const px = el.peri * Math.cos(omega);
    const py = el.peri * Math.sin(omega);
    drawMarker(px, py, "近点", "#ffbe64");

    if (Number.isFinite(el.apo)) {
      const ax = -el.apo * Math.cos(omega);
      const ay = -el.apo * Math.sin(omega);
      drawMarker(ax, ay, "远点", "#96dcff");
    }
  } else {
    // 双曲线/抛物线轨道：红色预测线
    const maxR = Math.hypot(cssW, cssH) / Math.max(zoom, 0.01) * 2;
    const nuMax = Math.acos(Math.min(1, -1 / el.e)) * 0.995;

    ctx.save();
    ctx.beginPath();
    let first = true;
    for (let i = 0; i <= points; i++) {
      const t = (2 * i / points) - 1; // -1 ~ 1
      const nu = t * nuMax;
      const denom = 1 + el.e * Math.cos(nu);
      if (denom <= 0.001) continue;
      const rr = Math.min(el.p / denom, maxR);
      const theta = nu + omega;
      const s = worldToScreen(rr * Math.cos(theta), rr * Math.sin(theta));

      if (first) {
        ctx.moveTo(s.x, s.y);
        first = false;
      } else {
        ctx.lineTo(s.x, s.y);
      }
    }

    ctx.setLineDash([5, 5]);
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = "rgba(255, 107, 107, 0.75)";
    ctx.stroke();
    ctx.restore();

    if (Number.isFinite(el.peri)) {
      const px = el.peri * Math.cos(omega);
      const py = el.peri * Math.sin(omega);
      drawMarker(px, py, "近点", "#ffbe64");
    }
  }
}

function drawMarker(x, y, text, color) {
  const s = worldToScreen(x, y);
  ctx.save();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(s.x, s.y, 3.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.font = "11px system-ui";
  ctx.fillText(text, s.x + 7, s.y - 5);
  ctx.restore();
}

function render() {
  ctx.fillStyle = "#05070d";
  ctx.fillRect(0, 0, cssW, cssH);

  // 1. 当前物理轨道线
  const el = getOrbitalElements();
  drawOrbit(el);

  // 2. 拖拽卫星时：从卫星直指鼠标的加速度矢量线 & 预判新轨道
  if (interactionType === "thrust") {
    const sSat = worldToScreen(sat.x, sat.y);
    const dx = dragCurrent.x - sSat.x;
    const dy = dragCurrent.y - sSat.y;

    // 绘制直接指向鼠标位置的绿色冲量线
    ctx.save();
    ctx.strokeStyle = "#2ed573";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(sSat.x, sSat.y);
    ctx.lineTo(dragCurrent.x, dragCurrent.y);
    ctx.stroke();

    // 绘制箭头头部
    const angle = Math.atan2(dy, dx);
    const arrowLen = 8;
    ctx.fillStyle = "#2ed573";
    ctx.beginPath();
    ctx.moveTo(dragCurrent.x, dragCurrent.y);
    ctx.lineTo(dragCurrent.x - arrowLen * Math.cos(angle - Math.PI / 6), dragCurrent.y - arrowLen * Math.sin(angle - Math.PI / 6));
    ctx.lineTo(dragCurrent.x - arrowLen * Math.cos(angle + Math.PI / 6), dragCurrent.y - arrowLen * Math.sin(angle + Math.PI / 6));
    ctx.fill();

    const tempDv = Math.hypot(dx, dy) * IMPULSE_SCALE;
    ctx.font = "bold 11px system-ui";
    ctx.fillText(`+Δv: ${tempDv.toFixed(2)} px/s`, dragCurrent.x + 10, dragCurrent.y);
    ctx.restore();

    // 预演改变后的轨道
    const tempSat = {
      ...sat,
      vx: sat.vx + dx * IMPULSE_SCALE,
      vy: sat.vy + dy * IMPULSE_SCALE
    };
    const tempEl = getOrbitalElements(tempSat);
    drawOrbit(tempEl, "rgba(255, 220, 90, 0.75)");
  }

  // 3. 历史轨迹线
  if (trail.length > 1) {
    ctx.save();
    ctx.beginPath();
    for (let i = 0; i < trail.length; i++) {
      const s = worldToScreen(trail[i].x, trail[i].y);
      if (i === 0) ctx.moveTo(s.x, s.y);
      else ctx.lineTo(s.x, s.y);
    }
    ctx.lineWidth = 1.2;
    ctx.strokeStyle = "rgba(255, 255, 255, 0.18)";
    ctx.stroke();
    ctx.restore();
  }

  // 4. 中心恒星
  const origin = worldToScreen(0, 0);
  const rStar = Math.max(16 * zoom, 4);
  const g = ctx.createRadialGradient(origin.x, origin.y, 2, origin.x, origin.y, rStar * 1.8);
  g.addColorStop(0, "rgba(255, 245, 190, 1)");
  g.addColorStop(0.4, "rgba(255, 190, 60, 0.8)");
  g.addColorStop(1, "rgba(255, 80, 20, 0)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(origin.x, origin.y, rStar * 1.8, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = "#ffeaa7";
  ctx.beginPath(); ctx.arc(origin.x, origin.y, Math.max(5 * zoom, 2), 0, Math.PI * 2); ctx.fill();

  // 5. 卫星与速度矢量
  const sSat = worldToScreen(sat.x, sat.y);

  // 当前速度矢量线 (蓝)
  ctx.strokeStyle = "rgba(120,220,255,0.7)";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(sSat.x, sSat.y);
  ctx.lineTo(sSat.x + sat.vx * 8 * zoom, sSat.y + sat.vy * 8 * zoom);
  ctx.stroke();

  // 刚刚施加的/圆动添加的 Δv 矢量提示 (绿)
  if (impulseMarker && impulseMarker.timer > 0) {
    const scale = 12 * zoom;
    const endX = sSat.x + impulseMarker.vx * scale;
    const endY = sSat.y + impulseMarker.vy * scale;

    ctx.save();
    ctx.strokeStyle = "#2ed573";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(sSat.x, sSat.y);
    ctx.lineTo(endX, endY);
    ctx.stroke();

    ctx.fillStyle = "#2ed573";
    ctx.font = "bold 11px system-ui";
    ctx.fillText(`施加 Δv: ${impulseMarker.mag.toFixed(2)} px/s`, endX + 8, endY + 4);
    ctx.restore();

    impulseMarker.timer -= lastRealDt;
  }

  // 卫星本体 (若鼠标悬停/拖拽近处时增加发光光圈提示)
  ctx.fillStyle = "#ffffff";
  ctx.beginPath(); ctx.arc(sSat.x, sSat.y, 4.5, 0, Math.PI * 2); ctx.fill();

  updateUI(el);
}

function updateUI(el) {
  ui.time.textContent = simTime.toFixed(2) + " s";
  ui.radius.textContent = el.r.toFixed(1) + " px";
  ui.speed.textContent = el.v.toFixed(2) + " px/s";

  const vCirc = Math.sqrt(GM / el.r);
  const vEsc = vCirc * Math.SQRT2;
  ui.circSpeed.textContent = vCirc.toFixed(2) + " px/s";
  ui.escSpeed.textContent = vEsc.toFixed(2) + " px/s";

  ui.scaleDisplay.textContent = Math.round(zoom * 100) + "%";

  ui.peri.textContent = Number.isFinite(el.peri) ? el.peri.toFixed(1) + " px" : "—";
  ui.apo.textContent = Number.isFinite(el.apo) ? el.apo.toFixed(1) + " px" : "∞";
  ui.semi.textContent = Number.isFinite(el.a) ? el.a.toFixed(1) + " px" : "—";
  ui.ecc.textContent = el.e.toFixed(4);
  ui.period.textContent = Number.isFinite(el.period) ? el.period.toFixed(2) + " s" : "∞";
  ui.type.textContent = el.type;
}

// ---------- 主循环 ----------
function loop(timestamp) {
  if (lastTimestamp === null) lastTimestamp = timestamp;

  let realDt = (timestamp - lastTimestamp) / 1000;
  lastTimestamp = timestamp;
  realDt = Math.min(Math.max(realDt, 0), MAX_FRAME_DT);
  lastRealDt = realDt;

  // 应用时间加速倍率
  accumulator += realDt * timeSpeed;

  // 高倍速时允许多个子步，低倍速时限制CPU占用
  const maxSubsteps = timeSpeed >= 50 ? MAX_SUBSTEPS_HARD : MAX_SUBSTEPS;
  let substeps = 0;
  while (accumulator >= FIXED_DT && substeps < maxSubsteps) {
    step(FIXED_DT);
    accumulator -= FIXED_DT;
    substeps++;
  }

  if (substeps >= maxSubsteps) accumulator = 0;

  render();
  requestAnimationFrame(loop);
}

reset();
requestAnimationFrame(loop);
</script>
</body>
